name: Temporary release guidance generation
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  generate:
    if: github.event.pull_request.number == 1564
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: packages/aethyme/rust
          shared-key: rust-tests
          save-if: false
      - name: Build release-version guidance generator
        run: cargo build --locked --manifest-path packages/aethyme/rust/Cargo.toml -p aethyme-cli -p aethyme-engine
      - name: Generate guidance for final tracked tree
        run: |
          set -euo pipefail
          git rm .github/workflows/temporary-release-guidance.yml
          packages/aethyme/rust/target/debug/aethyme deploy --generated-only --repo "$PWD"
          git add -A
          git diff --cached --binary HEAD -- . ':(exclude).github/workflows/temporary-release-guidance.yml' > "$RUNNER_TEMP/generated-guidance.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: generated-release-guidance
          path: ${{ runner.temp }}/generated-guidance.patch
          if-no-files-found: error
          retention-days: 1
