name: macOS nightly

# Full Rust workspace on macOS, the primary user platform (Homebrew). Pull
# requests run only the crates they change (oss-ci.yml, rust-tests-macos);
# this workflow owns the full macOS run. Recovery plan P1.6.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-tests-macos-full:
    name: Rust workspace tests (macOS)
    runs-on: macos-14
    defaults:
      run:
        working-directory: packages/aethyme/rust
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: packages/aethyme/rust

      - name: Run Rust tests
        run: cargo test --locked --workspace
