name: OSS CI

on:
  pull_request:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

# Retry transient registry and git fetch failures instead of failing the job
# on one dropped connection (Cargo's default is 3).
env:
  CARGO_NET_RETRY: "10"

concurrency:
  group: oss-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Product path ────────────────────────────────────────────────────────
  # The exit criterion of the python-retirement (plan Phase 6): a user who
  # runs `cargo install` never needs Python. This job proves it by running
  # the whole product surface behind a PATH that contains no interpreter.
  # The dev lanes below cannot prove this — they have Python by
  # construction — so if a product command ever reaches for an interpreter
  # again, this is the only job that fails.
  product-path-no-python:
    name: Product path (no Python on PATH)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: packages/aethyme/rust
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # One shared, cached target directory for the three installs: by default
      # each `cargo install` builds the shared dependencies again in its own
      # temporary directory.
      - name: Install the router and its sibling binaries
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/packages/aethyme/rust/target
        run: |
          cargo install --path packages/aethyme/rust/crates/aethyme-cli --locked
          cargo install --path packages/aethyme/rust/crates/aethyme-engine --locked
          cargo install --path packages/aethyme/rust/crates/aethyme-graph-indexer --locked

      - name: Exercise the product surface with no interpreter reachable
        run: |
          set -euo pipefail

          # Stage a sandbox bin dir holding only the Aethyme binaries and
          # the core utilities a shell/git needs. Symlink explicit absolute
          # paths, never `command -v` results — a wrapper earlier on PATH
          # can itself be an interpreter script, which would silently
          # reintroduce the dependency this job exists to exclude.
          SANDBOX="$RUNNER_TEMP/nopython-bin"
          mkdir -p "$SANDBOX"
          for p in /usr/bin/git /bin/bash /bin/sh /usr/bin/env /bin/cat /bin/cp /bin/mv \
                   /bin/rm /bin/mkdir /bin/rmdir /bin/grep /bin/sed /usr/bin/awk \
                   /usr/bin/diff /usr/bin/sort /usr/bin/head /usr/bin/tail /usr/bin/wc \
                   /usr/bin/find /usr/bin/dirname /usr/bin/basename /bin/mktemp \
                   /bin/chmod /bin/ln /bin/date /usr/bin/tr /bin/uname /bin/readlink \
                   /usr/bin/touch /bin/ls /usr/bin/id /usr/bin/xargs /usr/bin/cut /usr/bin/tee; do
            [ -x "$p" ] && ln -sf "$p" "$SANDBOX/$(basename "$p")"
          done
          for bin in aethyme aethyme-engine-cli aethyme-graph-index; do
            ln -sf "$HOME/.cargo/bin/$bin" "$SANDBOX/$bin"
          done
          export PATH="$SANDBOX"

          # Guard the guard: if an interpreter is reachable, this job
          # proves nothing and must fail loudly rather than pass quietly.
          if command -v python3 >/dev/null 2>&1 || command -v python >/dev/null 2>&1; then
            echo "FAIL: a Python interpreter is on PATH — this job cannot prove the product path" >&2
            exit 1
          fi

          aethyme --version
          aethyme --help

          TARGET="$RUNNER_TEMP/product-repo"
          mkdir -p "$TARGET/src" && cd "$TARGET"
          git init -q .
          git config user.email ci@example.com
          git config user.name CI
          printf 'def main():\n    return 0\n' > src/app.py
          printf '# Demo\n' > README.md
          git add -A && git commit -qm init

          # Canonical repository enrollment must work from only the installed
          # binary pair. The read-only verification command is the CI policy
          # gate repositories should retain after committing deployment files.
          aethyme deploy --repo .
          aethyme deploy verify --repo .
          if grep -R "$GITHUB_WORKSPACE/packages/aethyme" AGENTS.md CLAUDE.md .codex .claude; then
            echo "FAIL: deployed policy embeds the build checkout" >&2
            exit 1
          fi
          if grep -R "$TARGET" AGENTS.md CLAUDE.md .aethyme/generated/onboarding.json .codex .claude; then
            echo "FAIL: deployed policy embeds the target checkout" >&2
            exit 1
          fi

          # Quality surface. ai-ready exits 1 when it reports warnings,
          # which a fixture repo always does, so assert on the report
          # rather than the exit code.
          aethyme ai-ready --repo . > ai-ready.md || true
          grep -q "Detector Performance" ai-ready.md
          aethyme autofix . --dry-run
          aethyme repo commit-message-template --type fix --scope api > /dev/null

          # The deployed SessionStart hook — the last thing on the product
          # path that used a Python heredoc (flipped in Phase 6). Since
          # ecedc21f the envelope is gated behind AETHYME_EVAL_ARM: an
          # interactive session auto-loads CLAUDE.md itself, so emitting the
          # same bytes here would bill the whole policy a second time inside
          # the cached prefix. Assert both sides of that gate, so neither the
          # envelope nor the gate can regress unnoticed.
          AETHYME_EVAL_ARM=ci CLAUDE_PROJECT_DIR="$TARGET" \
            bash .claude/hooks/aethyme-load-context.sh > envelope.json
          grep -q '"hookEventName": "SessionStart"' envelope.json
          test -s envelope.json
          CLAUDE_PROJECT_DIR="$TARGET" \
            bash .claude/hooks/aethyme-load-context.sh > interactive.json
          if [[ -s interactive.json ]]; then
            echo "FAIL: hook injected context outside an eval arm" >&2
            exit 1
          fi

          # Index + the Explore chain and both readers over one saved file.
          aethyme-graph-index --repo-root "$TARGET" --repo-name demo --engine-version ci
          aethyme-engine-cli index --repo .
          aethyme explore --repo . --request "where is main defined" --format answer-json > explore.json
          grep -q '"schema_version": "aethyme-explore-v1"' explore.json
          aethyme explore-summary --from explore.json > /dev/null
          aethyme verify-targets --repo . --from explore.json > /dev/null

          echo "product path is Python-free"

  # ── Dev lane ────────────────────────────────────────────────────────────
  # The pytest harness that used to live here retired on 2026-08-06
  # (python-retirement Phase 7). Its implementation-blind suites are now
  # `aethyme-cli/tests/` and `aethyme-testkit/tests/`, so `cargo test
  # --workspace` is the whole test story for packages/aethyme and this
  # workflow installs no Python at all. `packages/aethyme-eval` keeps its
  # own Python by design and its own gate.
  rust-tests:
    name: Rust workspace tests
    # Main receives the same full workspace coverage through Aethyme Gates;
    # `warm-rust-cache` below compiles main's tests so this job starts warm.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/aethyme/rust
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      # Restores the cache `warm-rust-cache` saves from main. Pull requests do
      # not save: a cache written by a pull request is visible only to that
      # pull request, and would evict main's.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: packages/aethyme/rust
          shared-key: rust-tests
          save-if: false

      - name: Install cargo-nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest@0.9.146

      # Test helpers would run `cargo build --bin <name>` once per test process
      # to find the product binaries (aethyme-testkit/src/bins.rs). nextest
      # runs each test in its own process, so those builds queued on cargo's
      # lock for minutes each. Build once here; the test step sets
      # AETHYME_TESTKIT_PREBUILT_BINS=1 to use these binaries directly.
      - name: Build the product binaries
        run: cargo build --locked --workspace --bins

      # Compiling and running are separate steps so the job's log shows which
      # one is slow, and `--timings` records where the compile time goes:
      # download the `cargo-timings` artifact for the HTML report. nextest then
      # reuses these test binaries instead of building them.
      - name: Compile the workspace tests
        run: cargo test --locked --workspace --no-run --timings

      - name: Upload the compile timings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cargo-timings
          path: packages/aethyme/rust/target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore
          retention-days: 14

      # Library, binary and integration tests. `cargo test --workspace
      # --examples` stood in for this step until now, but a target flag
      # narrows cargo's selection to examples only: it ran three binaries.
      - name: Run workspace tests
        env:
          AETHYME_TESTKIT_PREBUILT_BINS: "1"
        run: cargo nextest run --locked --workspace --profile ci

  # nextest runs neither example targets nor doctests. The release-manifest
  # assertions live in examples (#435) and must keep running. A job of their
  # own so they run beside the workspace suite instead of after it.
  rust-examples-doctests:
    name: Rust examples and doctests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/aethyme/rust
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: packages/aethyme/rust
          shared-key: rust-tests
          save-if: false

      - name: Run example tests
        run: cargo test --locked --workspace --examples

      - name: Run doctests
        run: cargo test --locked --workspace --doc

  # ── Tested tree ─────────────────────────────────────────────────────────
  # A pull_request run tests GitHub's merge of the PR into its base. Once both
  # suites pass, record that merge's tree as an artifact. When a merge commit
  # on main has a byte-identical tree, Aethyme Gates skips the gates these
  # suites already cover (aethyme-gates.yml). If main moved after this run,
  # the trees differ and every gate runs.
  record-tested-tree:
    name: Record the tested tree
    if: github.event_name == 'pull_request'
    needs: [rust-tests, rust-examples-doctests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Name the tested tree
        run: |
          set -euo pipefail
          tree="$(git rev-parse 'HEAD^{tree}')"
          mkdir -p tested-tree
          printf '%s\n' "$tree" > tested-tree/tree
          echo "TESTED_TREE=$tree" >> "$GITHUB_ENV"

      - name: Upload the tested tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tested-tree-${{ env.TESTED_TREE }}
          path: tested-tree/tree
          retention-days: 14

  # ── Cache warm-up ───────────────────────────────────────────────────────
  # Compiles main's tests on each push so the pull-request test jobs above
  # restore a warm cache instead of starting cold. Builds only; main's test
  # verdict is Aethyme Gates. macOS is tested nightly (macos-nightly.yml),
  # which keeps its own cache.
  warm-rust-cache:
    name: Warm Rust cache (${{ matrix.os }})
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            key: rust-tests
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/aethyme/rust
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: packages/aethyme/rust
          shared-key: ${{ matrix.key }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest@0.9.146

      - name: Compile the workspace tests
        run: |
          cargo build --locked --workspace --bins
          cargo nextest run --locked --workspace --no-run
          cargo test --locked --workspace --examples --no-run

  # ── Lint ────────────────────────────────────────────────────────────────
  # The workspace is fmt-clean and clippy-clean with zero warnings; this job
  # keeps it that way. Runs on pull requests and on pushes to main.
  lint:
    name: Rust lint (fmt, clippy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/aethyme/rust
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: packages/aethyme/rust
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Check dependency advisories, licenses and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: packages/aethyme/rust/Cargo.toml
          command: check
