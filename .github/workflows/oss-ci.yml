name: OSS CI

on:
  pull_request:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  # ── Product path ────────────────────────────────────────────────────────
  # The exit criterion of the python-retirement (plan Phase 6): a user who
  # runs `cargo install` never needs Python. This job proves it by running
  # the whole product surface behind a PATH that contains no interpreter.
  # The dev lanes below cannot prove this — they have Python by
  # construction — so if a product command ever reaches for an interpreter
  # again, this is the only job that fails.
  product-path-no-python:
    name: Product path (no Python on PATH)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install the router and its sibling binaries
        run: |
          cargo install --path packages/aethyme/rust/crates/aethyme-cli --locked
          cargo install --path packages/aethyme/rust/crates/aethyme-engine --locked
          cargo install --path packages/aethyme/rust/crates/aethyme-graph-indexer --locked

      - name: Exercise the product surface with no interpreter reachable
        run: |
          set -euo pipefail

          # Stage a sandbox bin dir holding only the Aethyme binaries and
          # the core utilities a shell/git needs. Symlink explicit absolute
          # paths, never `command -v` results — a wrapper earlier on PATH
          # can itself be an interpreter script, which would silently
          # reintroduce the dependency this job exists to exclude.
          SANDBOX="$RUNNER_TEMP/nopython-bin"
          mkdir -p "$SANDBOX"
          for p in /usr/bin/git /bin/bash /bin/sh /usr/bin/env /bin/cat /bin/cp /bin/mv \
                   /bin/rm /bin/mkdir /bin/rmdir /bin/grep /bin/sed /usr/bin/awk \
                   /usr/bin/diff /usr/bin/sort /usr/bin/head /usr/bin/tail /usr/bin/wc \
                   /usr/bin/find /usr/bin/dirname /usr/bin/basename /bin/mktemp \
                   /bin/chmod /bin/ln /bin/date /usr/bin/tr /bin/uname /bin/readlink \
                   /usr/bin/touch /bin/ls /usr/bin/id /usr/bin/xargs /usr/bin/cut /usr/bin/tee; do
            [ -x "$p" ] && ln -sf "$p" "$SANDBOX/$(basename "$p")"
          done
          for bin in aethyme aethyme-engine-cli aethyme-graph-index; do
            ln -sf "$HOME/.cargo/bin/$bin" "$SANDBOX/$bin"
          done
          export PATH="$SANDBOX"

          # Guard the guard: if an interpreter is reachable, this job
          # proves nothing and must fail loudly rather than pass quietly.
          if command -v python3 >/dev/null 2>&1 || command -v python >/dev/null 2>&1; then
            echo "FAIL: a Python interpreter is on PATH — this job cannot prove the product path" >&2
            exit 1
          fi

          aethyme --version
          aethyme --help

          TARGET="$RUNNER_TEMP/product-repo"
          mkdir -p "$TARGET/src" && cd "$TARGET"
          git init -q .
          git config user.email ci@example.com
          git config user.name CI
          printf 'def main():\n    return 0\n' > src/app.py
          printf '# Demo\n' > README.md
          git add -A && git commit -qm init

          # Canonical repository enrollment must work from only the installed
          # binary pair. The read-only verification command is the CI policy
          # gate repositories should retain after committing deployment files.
          aethyme deploy --repo .
          aethyme deploy verify --repo .
          if grep -R "$GITHUB_WORKSPACE/packages/aethyme" AGENTS.md CLAUDE.md .codex .claude; then
            echo "FAIL: deployed policy embeds the build checkout" >&2
            exit 1
          fi
          if grep -R "$TARGET" AGENTS.md CLAUDE.md .aethyme/generated/onboarding.json .codex .claude; then
            echo "FAIL: deployed policy embeds the target checkout" >&2
            exit 1
          fi

          # Quality surface. ai-ready exits 1 when it reports warnings,
          # which a fixture repo always does, so assert on the report
          # rather than the exit code.
          aethyme ai-ready --repo . > ai-ready.md || true
          grep -q "Detector Performance" ai-ready.md
          aethyme autofix . --dry-run
          aethyme repo commit-message-template --type fix --scope api > /dev/null

          # The deployed SessionStart hook — the last thing on the product
          # path that used a Python heredoc (flipped in Phase 6).
          CLAUDE_PROJECT_DIR="$TARGET" bash .claude/hooks/aethyme-load-context.sh > envelope.json
          grep -q '"hookEventName": "SessionStart"' envelope.json
          test -s envelope.json

          # Index + the Explore chain and both readers over one saved file.
          aethyme-graph-index --repo-root "$TARGET" --repo-name demo --engine-version ci
          aethyme-engine-cli index --repo .
          aethyme explore --repo . --request "where is main defined" --format answer-json > explore.json
          grep -q '"schema_version": "aethyme-explore-v1"' explore.json
          aethyme explore-summary --from explore.json > /dev/null
          aethyme verify-targets --repo . --from explore.json > /dev/null

          echo "product path is Python-free"

  # ── Dev lane ────────────────────────────────────────────────────────────
  # The pytest harness that used to live here retired on 2026-08-06
  # (python-retirement Phase 7). Its implementation-blind suites are now
  # `aethyme-cli/tests/` and `aethyme-testkit/tests/`, so `cargo test
  # --workspace` is the whole test story for packages/aethyme and this
  # workflow installs no Python at all. `packages/aethyme-eval` keeps its
  # own Python by design and its own gate.
  rust-tests:
    name: Rust workspace tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/aethyme/rust
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        run: cargo test --workspace
