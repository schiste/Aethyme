name: OSS CI

on:
  pull_request:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

# No job needs authenticated Git operations after checkout. Keep the token out
# of local Git config: Aethyme's source-identity build scripts reject config
# includes and otherwise fall back to always-recheck on every Cargo run.
# Retry transient registry and git fetch failures instead of failing the job
# on one dropped connection (Cargo's default is 3).
env:
  CARGO_NET_RETRY: "10"

concurrency:
  group: oss-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Classify the PR diff with trusted classifier files from its base commit.
  # Workflow-level path filters leave required checks pending; job conditions
  # below preserve their check names and send uncertain diffs to full validation.
  classify_changes:
    name: Classify PR changes
    runs-on: ubuntu-latest
    outputs:
      docs_fast: ${{ steps.classify.outputs.docs_fast }}
      performance_fast: ${{ steps.classify.outputs.performance_fast }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify checkout credential policy
        run: bash .github/scripts/test-oss-checkout-credentials.sh

      - name: Verify classifier controls
        run: |
          set -euo pipefail
          bash .github/scripts/test-docs-fast-lane.sh
          bash .github/scripts/test-performance-fast-lane.sh
          bash .github/scripts/test-oss-ci-rustfmt-preflight.sh
          bash .github/scripts/test-rust-test-telemetry.sh

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "docs_fast=false" >> "$GITHUB_OUTPUT"
            echo "performance_fast=false" >> "$GITHUB_OUTPUT"
            echo "Full suite selected for a non-PR event."
            exit 0
          fi

          trusted_classifiers="$(mktemp -d "$RUNNER_TEMP/fast-lane-classifiers.XXXXXX")"
          trap 'rm -rf "$trusted_classifiers"' EXIT

          if git show "$PR_BASE_SHA:.github/scripts/docs-fast-lane.sh" \
            >"$trusted_classifiers/docs-fast-lane.sh" 2>/dev/null; then
            docs_fast="$(bash "$trusted_classifiers/docs-fast-lane.sh" "$PR_BASE_SHA" "$EVENT_SHA")"
          else
            docs_fast=false
            echo "Trusted docs classifier is unavailable; selecting the full suite."
          fi
          if git show "$PR_BASE_SHA:.github/scripts/performance-fast-lane.sh" \
            >"$trusted_classifiers/performance-fast-lane.sh" 2>/dev/null; then
            performance_fast="$(bash "$trusted_classifiers/performance-fast-lane.sh" "$PR_BASE_SHA" "$EVENT_SHA")"
          else
            performance_fast=false
            echo "Trusted performance classifier is unavailable; selecting the full suite."
          fi
          case "$docs_fast:$performance_fast" in
            true:true)
              echo "Both fast-lane classifiers selected the same diff; selecting full validation." >&2
              echo "docs_fast=false" >> "$GITHUB_OUTPUT"
              echo "performance_fast=false" >> "$GITHUB_OUTPUT"
              exit 1
              ;;
            true:false|false:true|false:false)
              printf 'docs_fast=%s\n' "$docs_fast" >> "$GITHUB_OUTPUT"
              printf 'performance_fast=%s\n' "$performance_fast" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Classifier returned an invalid result; selecting the full suite." >&2
              echo "docs_fast=false" >> "$GITHUB_OUTPUT"
              echo "performance_fast=false" >> "$GITHUB_OUTPUT"
              exit 1
              ;;
          esac
          if [[ "$docs_fast" == "true" ]]; then
            echo "Docs-only path: run the mirrored skill parity tests; skip product builds."
          elif [[ "$performance_fast" == "true" ]]; then
            echo "Performance-reporting path: run skill parity and bounded Python/workflow validation; skip product builds."
          else
            echo "Full validation path selected."
          fi

  # ── Product path ────────────────────────────────────────────────────────
  # The exit criterion of the python-retirement (plan Phase 6): a user who
  # runs `cargo install` never needs Python. This job proves it by running
  # the whole product surface behind a PATH that contains no interpreter.
  # The dev lanes below cannot prove this — they have Python by
  # construction — so if a product command ever reaches for an interpreter
  # again, this is the only job that fails.
  product-path-no-python:
    name: Product path (no Python on PATH)
    needs: classify_changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.classify_changes.result != 'success' || (needs.classify_changes.outputs.docs_fast != 'true' && needs.classify_changes.outputs.performance_fast != 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Check formatting before Rust work
        working-directory: packages/aethyme/rust
        run: cargo fmt --all -- --check

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: packages/aethyme/rust
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # One shared, cached target directory for the three installs: by default
      # each `cargo install` builds the shared dependencies again in its own
      # temporary directory.
      - name: Install the router and its sibling binaries
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/packages/aethyme/rust/target
        run: |
          cargo install --path packages/aethyme/rust/crates/aethyme-cli --locked
          cargo install --path packages/aethyme/rust/crates/aethyme-engine --locked
          cargo install --path packages/aethyme/rust/crates/aethyme-graph-indexer --locked

      - name: Exercise the product surface with no interpreter reachable
        run: |
          set -euo pipefail

          # Stage a sandbox bin dir holding only the Aethyme binaries and
          # the core utilities a shell/git needs. Symlink explicit absolute
          # paths, never `command -v` results — a wrapper earlier on PATH
          # can itself be an interpreter script, which would silently
          # reintroduce the dependency this job exists to exclude.
          SANDBOX="$RUNNER_TEMP/nopython-bin"
          mkdir -p "$SANDBOX"
          for p in /usr/bin/git /bin/bash /bin/sh /usr/bin/env /bin/cat /bin/cp /bin/mv \
                   /bin/rm /bin/mkdir /bin/rmdir /bin/grep /bin/sed /usr/bin/awk \
                   /usr/bin/diff /usr/bin/sort /usr/bin/head /usr/bin/tail /usr/bin/wc \
                   /usr/bin/find /usr/bin/dirname /usr/bin/basename /bin/mktemp \
                   /bin/chmod /bin/ln /bin/date /usr/bin/tr /bin/uname /bin/readlink \
                   /usr/bin/touch /bin/ls /usr/bin/id /usr/bin/xargs /usr/bin/cut /usr/bin/tee; do
            [ -x "$p" ] && ln -sf "$p" "$SANDBOX/$(basename "$p")"
          done
          for bin in aethyme aethyme-engine-cli aethyme-graph-index; do
            ln -sf "$HOME/.cargo/bin/$bin" "$SANDBOX/$bin"
          done
          export PATH="$SANDBOX"

          # Guard the guard: if an interpreter is reachable, this job
          # proves nothing and must fail loudly rather than pass quietly.
          if command -v python3 >/dev/null 2>&1 || command -v python >/dev/null 2>&1; then
            echo "FAIL: a Python interpreter is on PATH — this job cannot prove the product path" >&2
            exit 1
          fi

          aethyme --version
          aethyme --help

          TARGET="$RUNNER_TEMP/product-repo"
          mkdir -p "$TARGET/src" && cd "$TARGET"
          git init -q .
          git config user.email ci@example.com
          git config user.name CI
          printf 'def main():\n    return 0\n' > src/app.py
          printf '# Demo\n' > README.md
          git add -A && git commit -qm init

          # Standalone graph generation precedes broker enrollment. Once the
          # repository is managed, canonical graph writes use graph refresh.
          aethyme-graph-index --repo-root "$TARGET" --repo-name demo --engine-version ci

          # Canonical repository enrollment must work from only the installed
          # binary pair. The read-only verification command is the CI policy
          # gate repositories should retain after committing deployment files.
          aethyme deploy --repo .
          aethyme deploy verify --repo .
          if grep -R "$GITHUB_WORKSPACE/packages/aethyme" AGENTS.md CLAUDE.md .codex .claude; then
            echo "FAIL: deployed policy embeds the build checkout" >&2
            exit 1
          fi
          if grep -R "$TARGET" AGENTS.md CLAUDE.md .aethyme/generated/onboarding.json .codex .claude; then
            echo "FAIL: deployed policy embeds the target checkout" >&2
            exit 1
          fi

          # Quality surface. ai-ready exits 1 when it reports warnings,
          # which a fixture repo always does, so assert on the report
          # rather than the exit code.
          aethyme ai-ready --repo . > ai-ready.md || true
          grep -q "Detector Performance" ai-ready.md
          aethyme autofix . --dry-run
          aethyme repo commit-message-template --type fix --scope api > /dev/null

          # The deployed SessionStart hook — the last thing on the product
          # path that used a Python heredoc (flipped in Phase 6). Since
          # ecedc21f the envelope is gated behind AETHYME_EVAL_ARM: an
          # interactive session auto-loads CLAUDE.md itself, so emitting the
          # same bytes here would bill the whole policy a second time inside
          # the cached prefix. Assert both sides of that gate, so neither the
          # envelope nor the gate can regress unnoticed.
          AETHYME_EVAL_ARM=ci CLAUDE_PROJECT_DIR="$TARGET" \
            bash .claude/hooks/aethyme-load-context.sh > envelope.json
          grep -q '"hookEventName": "SessionStart"' envelope.json
          test -s envelope.json
          CLAUDE_PROJECT_DIR="$TARGET" \
            bash .claude/hooks/aethyme-load-context.sh > interactive.json
          if [[ -s interactive.json ]]; then
            echo "FAIL: hook injected context outside an eval arm" >&2
            exit 1
          fi

          # Materialize the generated graph and exercise Explore plus both
          # readers after enrollment, without bypassing canonical write guards.
          aethyme-engine-cli index --repo .
          aethyme explore --repo . --request "where is main defined" --format answer-json > explore.json
          grep -q '"schema_version": "aethyme-explore-v1"' explore.json
          aethyme explore-summary --from explore.json > /dev/null
          aethyme verify-targets --repo . --from explore.json > /dev/null

          echo "product path is Python-free"

  # ── Dev lane ────────────────────────────────────────────────────────────
  # The pytest harness that used to live here retired on 2026-08-06
  # (python-retirement Phase 7). Its implementation-blind suites are now
  # `aethyme-cli/tests/` and `aethyme-testkit/tests/`, so `cargo test
  # --workspace` is the whole Rust test story for packages/aethyme. The normal
  # product lane remains Python-free; `packages/aethyme-eval` keeps its Python
  # tooling by design and has a narrow reporting-only fast lane below.
  # The workspace suite is compiled once and run in shards. On one 4-core
  # runner it was 22-23 minutes: the 6,955 tests took about 3,200 seconds of
  # test time with the runner saturated, and the build ran twice because a
  # separate `cargo build --bins` resolved features without dev-dependencies.
  # `rust-tests-build` compiles every test and product binary once into a
  # nextest archive; each `rust-tests-shard` extracts it over a checkout of the
  # same tree and runs one hash partition with the CI profile. `rust-tests`
  # keeps the required check name: it passes only when the build, every shard
  # and the broker performance controls passed, and it publishes the run's
  # telemetry (job phases, shard balance, slowest and flaky tests).
  rust-tests-build:
    name: Rust workspace tests (build)
    needs: classify_changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.classify_changes.result != 'success' || (needs.classify_changes.outputs.docs_fast != 'true' && needs.classify_changes.outputs.performance_fast != 'true')) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/aethyme/rust
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Same history as the shards, so build scripts see the same tree.
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Check formatting before Rust work
        run: cargo fmt --all -- --check

      # Restores the cache `warm-rust-cache` saves from main. Pull requests do
      # not save: a cache written by a pull request is visible only to that
      # pull request, and would evict main's.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: packages/aethyme/rust
          shared-key: rust-tests
          save-if: false

      - name: Install cargo-nextest
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.146

      # Workspace crates build without debug info here: panics still report
      # file and line, and the archive every shard downloads is much smaller.
      # Third-party crates already build without it (.cargo/config.toml), so
      # the restored dependency cache stays valid. Set on this step only:
      # rust-cache keys on CARGO_* variables present when it restores.
      - name: Build the test archive
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: ../scripts/test-like-ci.sh --archive "$RUNNER_TEMP/rust-tests.tar.zst"

      - name: Record the build facts
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/rust-tests.tar.zst"
          bytes=$(stat -c %s "$archive")
          binaries=$(tar --zstd -tf "$archive" | grep -c '^target/debug/deps/')
          mkdir -p "$RUNNER_TEMP/rust-tests-build"
          printf '{"archive_bytes": %s, "test_binaries": %s}\n' "$bytes" "$binaries" \
            > "$RUNNER_TEMP/rust-tests-build/build.json"
          cp target/cargo-timings/cargo-timing.html "$RUNNER_TEMP/rust-tests-build/"
          echo "Archive: $((bytes / 1048576)) MiB, $binaries test binaries"

      - name: Upload the test archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-tests-archive
          path: ${{ runner.temp }}/rust-tests.tar.zst
          # Already zstd-compressed; the shards need it for this run only.
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      # `cargo-timing.html` shows where the compile time goes.
      - name: Upload the build telemetry
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-tests-build
          path: ${{ runner.temp }}/rust-tests-build/
          if-no-files-found: error
          retention-days: 14

  rust-tests-shard:
    name: Rust workspace tests (shard ${{ matrix.shard }}/6)
    needs: [classify_changes, rust-tests-build]
    if: ${{ !cancelled() && needs.rust-tests-build.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/aethyme/rust
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The plugin hook version guard compares this PR with its base.
          fetch-depth: 0

      # A few tests run cargo themselves; install the pinned toolchain in its
      # own step so its cost shows in the job's timings.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Install cargo-nextest
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.146

      - name: Download the test archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-tests-archive
          path: ${{ runner.temp }}/rust-tests-archive

      - name: Run workspace tests
        run: ../scripts/test-like-ci.sh --from-archive "$RUNNER_TEMP/rust-tests-archive/rust-tests.tar.zst" --partition "hash:${{ matrix.shard }}/6"

      - name: Upload the shard report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-tests-junit-shard-${{ matrix.shard }}
          path: packages/aethyme/rust/target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 14

  broker-performance-controls:
    name: Broker performance controls
    needs: classify_changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.classify_changes.result != 'success' || (needs.classify_changes.outputs.docs_fast != 'true' && needs.classify_changes.outputs.performance_fast != 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run broker performance controls in the full lane
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m unittest discover \
            -s packages/aethyme-eval/benchmarks/performance \
            -p 'test_broker_latency.py' -v
          python3 -m unittest discover \
            -s packages/aethyme-eval/benchmarks/performance \
            -p 'test_broker_concurrent_submit.py' -v
          python3 -m unittest discover \
            -s packages/aethyme-eval/benchmarks/performance \
            -p 'test_git_worktree_config.py' -v
          python3 -m unittest discover \
            -s packages/aethyme-eval/benchmarks/performance \
            -p 'test_git_worktree_options.py' -v

  rust-tests:
    name: Rust workspace tests
    needs: [classify_changes, rust-tests-build, rust-tests-shard, broker-performance-controls]
    # Main receives the same full workspace coverage through Aethyme Gates;
    # `warm-rust-cache` below compiles main's tests so the build starts warm.
    # Mirrored Markdown-only PRs run the exact skill parity tests with rustc
    # directly. Exact performance-reporting PRs also run parity plus bounded
    # Python/workflow checks; all uncertain diffs run the full Rust suite.
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reads this run's job and step timings for the telemetry summary.
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Rust
        if: ${{ needs.classify_changes.result == 'success' && (needs.classify_changes.outputs.docs_fast == 'true' || needs.classify_changes.outputs.performance_fast == 'true') }}
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Run mirrored skill parity tests without Cargo
        if: ${{ needs.classify_changes.result == 'success' && (needs.classify_changes.outputs.docs_fast == 'true' || needs.classify_changes.outputs.performance_fast == 'true') }}
        run: |
          set -euo pipefail
          rustc --edition=2021 --test .github/scripts/skill-parity-harness.rs \
            -o "$RUNNER_TEMP/skill-parity-tests"
          "$RUNNER_TEMP/skill-parity-tests" --test-threads=1

      - name: Validate non-Rust performance reporting
        if: ${{ needs.classify_changes.result == 'success' && needs.classify_changes.outputs.performance_fast == 'true' }}
        run: bash .github/scripts/validate-performance-fast-lane.sh

      # Unknown classifier results select the full suite, so a failed or
      # skipped build, shard or control job fails this required check.
      - name: Require the full suite
        if: ${{ needs.classify_changes.result != 'success' || (needs.classify_changes.outputs.docs_fast != 'true' && needs.classify_changes.outputs.performance_fast != 'true') }}
        env:
          BUILD: ${{ needs.rust-tests-build.result }}
          SHARDS: ${{ needs.rust-tests-shard.result }}
          CONTROLS: ${{ needs.broker-performance-controls.result }}
        run: |
          set -euo pipefail
          echo "build=$BUILD shards=$SHARDS controls=$CONTROLS"
          [[ "$BUILD" == success && "$SHARDS" == success && "$CONTROLS" == success ]]

      - name: Download the shard reports
        if: ${{ always() && needs.rust-tests-build.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rust-tests-junit-shard-*
          path: ${{ runner.temp }}/rust-tests-junit

      - name: Download the build telemetry
        if: ${{ always() && needs.rust-tests-build.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-tests-build
          path: ${{ runner.temp }}/rust-tests-build

      # Job timings are best effort: an unreadable API leaves the summary
      # saying so, and never fails the check that the tests already decided.
      - name: Summarize the run
        if: ${{ always() && needs.rust-tests-build.result == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rust-test-telemetry"
          mkdir -p "$out"
          if ! gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100" \
            > "$out/jobs.json"; then
            echo "::warning::Job timings are unavailable; the summary reports them as such."
            rm -f "$out/jobs.json"
          fi
          python3 .github/scripts/rust-test-telemetry.py \
            --junit-dir "$RUNNER_TEMP/rust-tests-junit" \
            --build-json "$RUNNER_TEMP/rust-tests-build/build.json" \
            --jobs-json "$out/jobs.json" \
            --markdown "$out/summary.md" \
            --json "$out/rust-test-telemetry.json"
          cat "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the run telemetry
        if: ${{ always() && needs.rust-tests-build.result == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-test-telemetry
          path: ${{ runner.temp }}/rust-test-telemetry/
          if-no-files-found: warn
          retention-days: 90

  # nextest runs neither example targets nor doctests. The release-manifest
  # assertions live in examples (#435) and must keep running. A job of their
  # own so they run beside the workspace suite instead of after it.
  rust-examples-doctests:
    name: Rust examples and doctests
    needs: classify_changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.classify_changes.result != 'success' || (needs.classify_changes.outputs.docs_fast != 'true' && needs.classify_changes.outputs.performance_fast != 'true')) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/aethyme/rust
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Check formatting before Rust work
        run: cargo fmt --all -- --check

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: packages/aethyme/rust
          shared-key: rust-tests
          save-if: false

      - name: Run example tests
        run: cargo test --locked --workspace --examples

      - name: Run doctests
        run: cargo test --locked --workspace --doc

  # ── Tested tree ─────────────────────────────────────────────────────────
  # A pull_request run tests GitHub's merge of the PR into its base. Once both
  # suites pass, record that merge's tree as an artifact. When a merge commit
  # on main has a byte-identical tree, Aethyme Gates skips the gates these
  # suites already cover (aethyme-gates.yml). If main moved after this run,
  # the trees differ and every gate runs.
  record-tested-tree:
    name: Record the tested tree
    # Fast-lane trees did not run the workspace/examples suites; never emit
    # the artifact that tells Aethyme Gates those suites covered this tree.
    if: ${{ github.event_name == 'pull_request' && needs.classify_changes.result == 'success' && needs.classify_changes.outputs.docs_fast != 'true' && needs.classify_changes.outputs.performance_fast != 'true' }}
    needs: [classify_changes, rust-tests, rust-examples-doctests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Name the tested tree
        run: |
          set -euo pipefail
          tree="$(git rev-parse 'HEAD^{tree}')"
          mkdir -p tested-tree
          printf '%s\n' "$tree" > tested-tree/tree
          echo "TESTED_TREE=$tree" >> "$GITHUB_ENV"

      - name: Upload the tested tree
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tested-tree-${{ env.TESTED_TREE }}
          path: tested-tree/tree
          retention-days: 14

  # ── Cache warm-up ───────────────────────────────────────────────────────
  # Compiles main's tests on each push so the pull-request test jobs above
  # restore a warm cache instead of starting cold. Builds only; main's test
  # verdict is Aethyme Gates. macOS is tested nightly (macos-nightly.yml),
  # which keeps its own cache.
  warm-rust-cache:
    name: Warm Rust cache (${{ matrix.os }})
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            key: rust-tests
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/aethyme/rust
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Check formatting before Rust work
        run: cargo fmt --all -- --check

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: packages/aethyme/rust
          shared-key: ${{ matrix.key }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.146

      - name: Compile the workspace tests
        run: |
          cargo build --locked --workspace --bins
          cargo nextest run --locked --workspace --no-run
          cargo test --locked --workspace --examples --no-run

  # ── Lint ────────────────────────────────────────────────────────────────
  # The workspace is fmt-clean and clippy-clean with zero warnings; this job
  # keeps it that way. Runs on pull requests and on pushes to main.
  lint:
    name: Rust lint (fmt, clippy)
    needs: classify_changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.classify_changes.result != 'success' || (needs.classify_changes.outputs.docs_fast != 'true' && needs.classify_changes.outputs.performance_fast != 'true')) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/aethyme/rust
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: packages/aethyme/rust
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        id: format_check
        run: cargo fmt --all -- --check

      - name: Materialize rustfmt patch
        id: rustfmt_patch
        if: ${{ failure() && steps.format_check.outcome == 'failure' }}
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/rustfmt.patch"
          available=false
          if cargo fmt --all; then
            git diff --binary -- . >"$patch"
            if [[ -s "$patch" ]]; then
              available=true
            fi
          else
            echo "cargo fmt could not materialize a proposed patch" >&2
          fi
          printf 'available=%s\n' "$available" >>"$GITHUB_OUTPUT"

      - name: Upload suggested rustfmt patch
        if: ${{ failure() && steps.rustfmt_patch.outputs.available == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rustfmt-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/rustfmt.patch
          if-no-files-found: error
          retention-days: 7

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Check dependency advisories, licenses and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: packages/aethyme/rust/Cargo.toml
          command: check
