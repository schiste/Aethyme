name: Release prepare

# Renders a release's generated agent-instruction files on Linux, so preparing
# a release never compiles Rust on a workstation. Commit and push the version
# bump on the release branch first, then dispatch on that branch:
#   gh workflow run release-prepare.yml --ref agent/prepare-release-vX.Y.Z
# The job writes nothing to the repository. It uploads the rendered changes as
# a patch artifact, `release-generated-<commit sha>`, holding one file,
# `release-generated.patch`, which the release session applies with
# `git apply --index` and commits through the broker.
#
# The render is a function of the tracked tree and the built version: the
# onboarding digest hashes tracked paths and contents only, the repository
# name comes from the origin URL, and the policy stamp is the crate version.
on:
  workflow_dispatch:

permissions:
  contents: read

# Same Cargo environment as OSS CI: rust-cache hashes CARGO_* variables into
# its key, so a difference here would miss main's warm cache.
env:
  CARGO_NET_RETRY: "10"

concurrency:
  group: release-prepare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render generated release files
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      # Restores the cache that OSS CI's `warm-rust-cache` saves from main. A
      # release bump changes Cargo.lock, so this is a prefix hit: dependencies
      # come warm and only the workspace crates rebuild. Never saves.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: packages/aethyme/rust
          shared-key: rust-tests
          save-if: false

      # `deploy --generated-only` renders in-process in the router; it never
      # starts the engine sibling, so the engine is not built.
      - name: Build the router
        working-directory: packages/aethyme/rust
        run: |
          cargo build --locked -p aethyme-cli
          ./target/debug/aethyme --version

      - name: Render the generated files
        run: |
          set -euo pipefail
          aethyme=./packages/aethyme/rust/target/debug/aethyme
          "$aethyme" deploy --generated-only --repo "$GITHUB_WORKSPACE"
          # Agent-maintained skill trees are not regenerated by a release.
          git checkout -- .claude/skills/aethyme .claude/skills/repo-act \
            .codex/skills/aethyme .codex/skills/repo-act
          "$aethyme" deploy verify --generated-only --repo "$GITHUB_WORKSPACE"

      - name: Package the generated-file patch
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          generated=(
            .aethyme/generated/onboarding.json
            .claude/skills/repo-onboarding/SKILL.md
            .codex/skills/repo-onboarding/SKILL.md
            AGENTS.md
            CLAUDE.md
          )
          head="$(git rev-parse HEAD)"
          if [[ "$head" != "$SOURCE_SHA" ]]; then
            echo "FAIL: checked out $head, expected $SOURCE_SHA" >&2
            exit 1
          fi

          unexpected="$(
            { git diff --name-only HEAD; git ls-files --others --exclude-standard; } \
              | grep -vxF -f <(printf '%s\n' "${generated[@]}") || true
          )"
          if [[ -n "$unexpected" ]]; then
            echo "FAIL: deploy changed paths outside the generated release files:" >&2
            while IFS= read -r path; do printf '  %s\n' "$path"; done <<<"$unexpected" >&2
            exit 1
          fi

          patch="$RUNNER_TEMP/release-generated.patch"
          git diff --binary HEAD -- "${generated[@]}" >"$patch"
          if [[ ! -s "$patch" ]]; then
            echo "FAIL: the render changed nothing; push the committed version bump to this branch before dispatching" >&2
            exit 1
          fi

          {
            echo "### Generated release files for \`$head\`"
            echo
            echo "Artifact \`release-generated-$head\`: \`release-generated.patch\`, $(( $(wc -l <"$patch") )) lines."
            echo
            echo "| File | Added | Removed |"
            echo "| --- | ---: | ---: |"
            git diff --numstat HEAD -- "${generated[@]}" \
              | awk -F '\t' '{ printf "| `%s` | %s | %s |\n", $3, $1, $2 }'
          } >>"$GITHUB_STEP_SUMMARY"
          git diff --stat HEAD -- "${generated[@]}"

      - name: Upload the generated-file patch
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-generated-${{ github.sha }}
          path: ${{ runner.temp }}/release-generated.patch
          if-no-files-found: error
          retention-days: 3
