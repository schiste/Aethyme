name: Cross-Process Contract Check

# Auto-detects PRs that remove or rename symbols listed in
# `packages/aethyme/docs/architecture/cross-process-consumers.md`
# without declaring a contract decision in the PR body. This is the
# friction layer for the cardinal rule: deleting a cross-process
# entry point must be deliberate, not an accidental side effect of
# refactoring. The 2026-05-08 hard-delete of the Python `explore`
# command broke the deployed `aethyme-explore` wrapper because this
# check didn't exist; now it does.
#
# The checker is native since python-retirement Phase 6 (2026-08-01):
# `aethyme broker check-contract`, built from this checkout. It had to
# be ported BEFORE `src/` was deleted, or the migration's biggest
# deletion would have landed with its own guard switched off.

on:
  pull_request:
    branches: ["main", "master"]
    types: [opened, reopened, synchronize, edited]

env:
  # Match the trusted main-branch Rust cache warmer's environment fingerprint.
  CARGO_NET_RETRY: "10"

jobs:
  contract-check:
    name: Cross-process contract check
    # A rerun keeps the original event payload. Revalidate changed PR bodies
    # and changed bases (retargeting a stacked PR to main changes the diff the
    # contract is judged on), but avoid rebuilding the checker for title-only
    # edits.
    if: github.event.action != 'edited' || github.event.changes.body || github.event.changes.base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR (full history for diff)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Check the PR head itself, then compare it with the merge base
          # against the target branch. This keeps main-only commits out of
          # the PR's contract diff when the branch is behind.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # Avoid transient credential includes forcing conservative build identity.
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      # Reuse the protected-main cache warmed for the same Rust workspace;
      # never let an untrusted PR write shared compiler artifacts.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: packages/aethyme/rust
          shared-key: rust-tests
          save-if: false

      - name: Capture PR body
        # Write the PR body to a file so the checker can parse the
        # `Contract:` checkbox. We avoid interpolating the body
        # into a shell command (injection-safe) by reading it from
        # the GitHub event payload via jq.
        run: |
          jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" > /tmp/pr-body.md
          echo "PR body captured ($(wc -c < /tmp/pr-body.md) bytes)"

      - name: Run cross-process contract check
        # PR head and `BASE_REF` are read from env, not interpolated into the run
        # script — this is the safe pattern for untrusted-ish
        # context fields. github.base_ref is set by GitHub from the
        # branch protection target and isn't directly user-supplied,
        # but the same hygiene applies.
        #
        # `cargo run` from the repo root: the checker resolves the
        # registry and the diff relative to the current worktree, so
        # cwd must stay at the repository root.
        #
        # `--commit-messages` gives this check the same decision sources as
        # the `cross-process-contract` gate, which reads the merged commits
        # and the merged PR's body on main: a decision accepted here is
        # accepted again on the merge commit.
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The checker is built from the PR tree. Keep any broker access by
          # its startup path or dependencies away from a runner's repository
          # state; an unreviewed schema migration must be disposable (#232).
          AETHYME_BROKER_DB: ${{ runner.temp }}/aethyme-broker-contract-check.db
        run: |
          if ! CONTRACT_BASE="$(git merge-base "origin/${BASE_REF}" "${PR_HEAD_SHA}")"; then
            echo "ERROR: could not find a common ancestor for the PR head and base." >&2
            exit 2
          fi
          printf 'PR comparison base: %s\n' "$CONTRACT_BASE"
          cargo run --locked --quiet \
            --manifest-path packages/aethyme/rust/Cargo.toml \
            -p aethyme-cli --bin aethyme -- \
            broker check-contract \
            --base "$CONTRACT_BASE" \
            --pr-body /tmp/pr-body.md \
            --commit-messages
