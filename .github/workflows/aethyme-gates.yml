name: Aethyme Gates

# Convergence lane: gates.toml is the single definition of "verified" —
# this workflow runs the exact gates, via the exact runner, that the
# broker runs before promoting a session (`aethyme broker advanced gates run
# --all`). Certify merged trees here; OSS CI runs the full Rust workspace
# on pull requests. Keep the binary-driven subset available manually.
#
# No untrusted event data (`github.event.*`) is interpolated into any
# `run:` block here — every step is a fixed command.

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  # Finds the pull-request run that already tested this merge's tree.
  actions: read
  # cross-process-contract reads the merged PR's body for its contract
  # decision (`gh api repos/{owner}/{repo}/commits/<sha>/pulls`).
  pull-requests: read

# Retry transient registry and git fetch failures instead of failing the job
# on one dropped connection (Cargo's default is 3).
env:
  CARGO_NET_RETRY: "10"

# One group per commit: every commit on main gets a completed verdict.
# Cancelling superseded runs left merge commits (including a release commit on
# 2026-09-23) with no verdict at all, and releases are tagged only on a commit
# whose gates passed.
concurrency:
  group: aethyme-gates-${{ github.sha }}
  cancel-in-progress: false

jobs:
  gates:
    name: Run all gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # cross-process-contract falls back to HEAD~1 when the broker's
          # local integration ref is absent on a clean GitHub runner.
          fetch-depth: 0

      # The `ruff` and `pytest-local` gates retired with the pytest stack
      # on 2026-08-06 (python-retirement Phase 7), so this lane no longer
      # provisions a venv for `packages/aethyme` — that package holds no
      # Python. The one Python gate left, `pytest-aethyme-eval`,
      # provisions its own venv inside the tree under test; it needs an
      # interpreter on PATH and nothing else.
      - name: Set up Python (for the aethyme-eval gate only)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Rust
        id: toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      # This job is on the release path (a release is tagged only on a commit
      # whose gates passed) and used to build everything from scratch.
      # rust-cache keeps third-party dependencies only and rebuilds the
      # workspace's own crates, so a restore never stands in for compiling the
      # code under test.
      - name: Cache the aethyme release build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: packages/aethyme/rust
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build aethyme binary
        run: cargo build --locked --release --manifest-path packages/aethyme/rust/Cargo.toml --bin aethyme

      # The cargo-test gate runs the workspace suite under nextest when it is
      # on PATH (`.aethyme/gates.toml`); under `cargo test` that gate took
      # about 17 minutes here. Same pinned version as oss-ci.yml.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-nextest@0.9.146

      # The Rust gates build into the broker's managed cache,
      # `<host cache>/gates/<repository key>/rust-workspace-v3`, where the key
      # is the SHA-256 of the repository's canonical origin
      # (`repository_key` in aethyme-broker gates.rs). A wrong key only means
      # a cold build, never a wrong verdict.
      - name: Locate the gates' managed build cache
        run: |
          set -euo pipefail
          key="$(printf '%s' "github.com/${GITHUB_REPOSITORY,,}" | sha256sum | cut -c1-64)"
          echo "GATE_CACHE_DIR=$HOME/.cache/aethyme/gates/$key/rust-workspace-v3" >> "$GITHUB_ENV"

      # Restores now; its post-step saves at the end of a successful job only
      # when no entry matched the key exactly (a lockfile or toolchain change).
      - name: Cache the gates' managed build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GATE_CACHE_DIR }}
          key: aethyme-gate-cache-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('packages/aethyme/rust/Cargo.lock') }}
          restore-keys: |
            aethyme-gate-cache-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-

      # A merge commit whose tree a pull-request run already tested
      # (OSS CI's record-tested-tree job, after the workspace suite and the
      # examples and doctests passed) skips the gates those suites cover.
      # Only an artifact from a run in this repository counts, not one from a
      # fork. Every other gate still runs, including gates added later.
      # A manual dispatch, or any tree no PR run tested, runs every gate.
      - name: Look for a pull-request run that tested this tree
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tree="$(git rev-parse 'HEAD^{tree}')"
          repo_id="$(gh api "repos/$GITHUB_REPOSITORY" --jq .id)"
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=tested-tree-$tree&per_page=100" \
            --jq "[.artifacts[] | select(.expired == false and .workflow_run.head_repository_id == $repo_id) | .workflow_run.id] | first // empty")"
          if [ -n "$run" ]; then
            echo "Tree $tree passed the workspace suite in pull-request run $run."
            echo "TESTED_BY_RUN=$run" >> "$GITHUB_ENV"
          else
            echo "No pull-request run tested tree $tree; every gate runs."
          fi

      - name: Run all gates
        env:
          # A fresh runner has no gate-trust record and no gate history, so the
          # broker would refuse this repository's own gates (P2.1). CI runs the
          # gates this repository defines on its own main branch; that is the
          # trust decision, made here explicitly.
          AETHYME_TRUST_NONINTERACTIVE_FOR_TESTS: "1"
          # cross-process-contract looks up the pull request merged as this
          # commit when the merged commits declare no contract decision; the
          # decision conventionally lives in the PR body. Read-only.
          GH_TOKEN: ${{ github.token }}
          # Gates the pull-request suites run in full: the workspace suite
          # (cargo-test), the examples and their guard tests (fast-guards),
          # and the testkit contract tests (workflow-contract, gate-policy).
          COVERED_BY_PR_SUITE: "cargo-test fast-guards workflow-contract gate-policy"
        run: |
          set -euo pipefail
          aethyme=packages/aethyme/rust/target/release/aethyme
          if [ -z "${TESTED_BY_RUN:-}" ]; then
            exec "$aethyme" broker advanced gates run --all
          fi
          # An assignment carries the pipeline's failure to `set -e`; a `for`
          # over a command substitution would run no gate and pass.
          gates="$("$aethyme" broker advanced gates manifest --json | jq -r '.manifest.gates[].name')"
          [ -n "$gates" ] || { echo "the gate manifest lists no gates" >&2; exit 1; }
          for gate in $gates; do
            case " $COVERED_BY_PR_SUITE " in
              *" $gate "*) echo "gate $gate: covered by pull-request run $TESTED_BY_RUN on this tree" ;;
              *) "$aethyme" broker advanced gates run --all --only "$gate" ;;
            esac
          done

      # Runs after the gates, before the cache post-step saves. Keep
      # third-party artifacts only: the workspace's own crates, test binaries
      # and incremental state are rebuilt on every run anyway, and dropping
      # them keeps the entry within the repository's cache budget.
      - name: Keep only third-party artifacts in the gates' cache
        run: |
          set -euo pipefail
          dir="$GATE_CACHE_DIR/debug"
          [ -d "$dir" ] || exit 0
          rm -rf "$dir/incremental" "$dir/examples"
          rm -rf "$dir"/deps/aethyme* "$dir"/deps/libaethyme* "$dir"/.fingerprint/aethyme* "$dir"/build/aethyme*
          # Test and binary executables (no extension) are workspace outputs.
          find "$dir" -maxdepth 1 -type f -perm -u+x -delete
          find "$dir/deps" -maxdepth 1 -type f -perm -u+x ! -name '*.so' ! -name '*.dylib' ! -name '*.rlib' ! -name '*.rmeta' ! -name '*.d' -delete
          du -sh "$GATE_CACHE_DIR"
