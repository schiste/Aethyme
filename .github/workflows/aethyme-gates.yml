name: Aethyme Gates

# Convergence lane: gates.toml is the single definition of "verified" —
# this workflow runs the exact gates, via the exact runner, that the
# broker runs before promoting a session (`aethyme broker gates run
# --all`). Certify merged trees here; OSS CI runs the full Rust workspace
# on pull requests. Keep the binary-driven subset available manually.
#
# No untrusted event data (`github.event.*`) is interpolated into any
# `run:` block here — every step is a fixed command.

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aethyme-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Run all gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # cross-process-contract falls back to HEAD~1 when the broker's
          # local integration ref is absent on a clean GitHub runner.
          fetch-depth: 0

      # The `ruff` and `pytest-local` gates retired with the pytest stack
      # on 2026-08-06 (python-retirement Phase 7), so this lane no longer
      # provisions a venv for `packages/aethyme` — that package holds no
      # Python. The one Python gate left, `pytest-aethyme-eval`,
      # provisions its own venv inside the tree under test; it needs an
      # interpreter on PATH and nothing else.
      - name: Set up Python (for the aethyme-eval gate only)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build aethyme binary
        run: cargo build --locked --release --manifest-path packages/aethyme/rust/Cargo.toml --bin aethyme

      - name: Run all gates
        run: packages/aethyme/rust/target/release/aethyme broker gates run --all
