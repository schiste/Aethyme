name: Release binaries

on:
  push:
    tags: ["v*"]

permissions:
  actions: read
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-26-intel
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/aethyme/rust
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history + tags so build.rs embeds the tag in
          # `aethyme --version` via `git describe`.
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify release version contract
        env:
          AETHYME_RELEASE_TAG: ${{ github.ref_name }}
        run: cargo test --locked -p aethyme-testkit --test release_contract

      - name: Build release binaries
        run: cargo build --release --locked -p aethyme-cli --bin aethyme -p aethyme-engine --bin aethyme-engine-cli

      - name: Verify embedded release versions
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          expected="${REF_NAME#v}"
          router_version="$(./target/release/aethyme --version | awk '{print $2}')"
          engine_version="$(./target/release/aethyme-engine-cli --version | awk '{print $2}')"
          test "$router_version" = "$expected"
          test "$engine_version" = "$expected"

      - name: Package archive
        env:
          # Tag names may contain shell metacharacters — never inline
          # github.ref_name into run: commands.
          REF_NAME: ${{ github.ref_name }}
        run: |
          tar -C target/release -czf "aethyme-${REF_NAME}-${{ matrix.target }}.tar.gz" \
            aethyme aethyme-engine-cli

      - name: Smoke installed archive
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "$smoke_root"' EXIT
          tar -xzf "aethyme-${REF_NAME}-${{ matrix.target }}.tar.gz" -C "$smoke_root"
          "$smoke_root/aethyme" --version
          "$smoke_root/aethyme-engine-cli" --version
          "$smoke_root/aethyme" broker quick-test

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: aethyme-${{ matrix.target }}
          path: packages/aethyme/rust/aethyme-*-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: Attach to GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir dist
          find dist -mindepth 2 -type f -name '*.tar.gz' -exec mv {} dist/ \;
          find dist -mindepth 1 -type d -empty -delete
          count="$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d ' ')"
          test "$count" = "3"

      - name: Build release manifest and checksums
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$GITHUB_SHA"
          case "$REF_NAME" in
            *-*) release_channel=preview ;;
            *) release_channel=stable ;;
          esac
          cp install.sh dist/install.sh
          cargo run --locked --manifest-path packages/aethyme/rust/Cargo.toml \
            -p aethyme-broker --example release_manifest -- \
            --dist "$GITHUB_WORKSPACE/dist" \
            --tag "$REF_NAME" \
            --source-sha "$source_sha" \
            --channel "$release_channel" \
            --output "$GITHUB_WORKSPACE/dist/release-manifest.json"
          if [ "$release_channel" = stable ]; then
            cargo run --locked --manifest-path packages/aethyme/rust/Cargo.toml \
              -p aethyme-broker --example homebrew_formula -- \
              --manifest "$GITHUB_WORKSPACE/dist/release-manifest.json" \
              --repo "$GITHUB_REPOSITORY" \
              --output "$GITHUB_WORKSPACE/dist/aethyme.rb"
          fi
          cd dist
          sha256sum --check SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify release manifest
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          cosign sign-blob --yes \
            --bundle dist/release-manifest.sigstore.json \
            dist/release-manifest.json
          cosign verify-blob \
            --bundle dist/release-manifest.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${REF_NAME}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/release-manifest.json

      - name: Create or update release
        # Third-party action with a write-scoped token: pinned to a full
        # commit SHA rather than a movable tag.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: dist/*
          body_path: packages/aethyme/docs/guides/upgrading-to-v0.7.2.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
