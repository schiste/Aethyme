name: Release binaries

on:
  push:
    tags: ["v*"]

permissions:
  actions: read
  contents: read

jobs:
  # Recovery plan P1.2: a release is cut only from a commit that is on main and
  # whose Aethyme Gates run passed. v0.7.25 was tagged one minute after main's
  # gates failed; this job makes that impossible rather than a matter of care.
  verify-green-main:
    name: Tagged commit passed Aethyme Gates on main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a green gates run on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "tagged commit $SHA is not on main" >&2
            exit 1
          fi
          conclusions="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/aethyme-gates.yml/runs?head_sha=$SHA&status=completed" \
            --jq '[.workflow_runs[].conclusion] | join(" ")')"
          case " $conclusions " in
            *" success "*) echo "Aethyme Gates passed on $SHA" ;;
            *) echo "Aethyme Gates has no passing run on $SHA (completed: ${conclusions:-none}); tag a commit whose gates passed" >&2
               exit 1 ;;
          esac

  build:
    name: Build (${{ matrix.target }})
    needs: verify-green-main
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-26-intel
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Native arm64 runner rather than cross-compiling: the smoke step
          # below then exercises the archive on the platform it ships for.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # Static musl build for Alpine and other non-glibc distributions.
          # The C dependencies (bundled SQLite, tree-sitter, BLAKE3) build
          # with musl-gcc from musl-tools; everything else is pure Rust.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/aethyme/rust
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Add the target to the pinned toolchain
        # rust-toolchain.toml pins the channel, so inside the checkout cargo
        # runs that toolchain, not the `stable` one set up above. A target
        # that is not the runner's host (musl) must be added to the pinned
        # toolchain, or std is missing: "can't find crate for `core`" (v0.8.5).
        run: rustup target add ${{ matrix.target }}

      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools

      - name: Build release binaries
        env:
          # cc-rs compiles the C dependencies with musl-gcc for the musl target.
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          cargo build --release --locked --target "${{ matrix.target }}" \
            -p aethyme-cli --bin aethyme -p aethyme-engine --bin aethyme-engine-cli

      - name: Build release manifest helpers
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo build --release --locked --target "${{ matrix.target }}" \
            -p aethyme-broker --example release_manifest --example homebrew_formula
          helper_stage_dir="$RUNNER_TEMP/aethyme-release-helpers"
          mkdir -p "$helper_stage_dir"
          cp "target/${{ matrix.target }}/release/examples/release_manifest" "$helper_stage_dir/"
          cp "target/${{ matrix.target }}/release/examples/homebrew_formula" "$helper_stage_dir/"
          printf '%s\n' "$GITHUB_SHA" > "$helper_stage_dir/source.sha"
          (
            cd "$helper_stage_dir"
            sha256sum release_manifest homebrew_formula > SHA256SUMS
          )
          tar -czf "target/${{ matrix.target }}/release-helpers.tar.gz" -C "$helper_stage_dir" \
            release_manifest homebrew_formula source.sha SHA256SUMS

      - name: Verify release version contract
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        env:
          AETHYME_RELEASE_TAG: ${{ github.ref_name }}
          AETHYME_RELEASE_COMMIT: ${{ github.sha }}
          AETHYME_RELEASE_BINARY_DIR: ${{ github.workspace }}/packages/aethyme/rust/target/${{ matrix.target }}/release
        run: cargo test --locked -p aethyme-testkit --test release_contract

      - name: Verify release helper contract
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          AETHYME_RELEASE_TAG: ${{ github.ref_name }}
          AETHYME_RELEASE_COMMIT: ${{ github.sha }}
          AETHYME_RELEASE_BINARY_DIR: ${{ github.workspace }}/packages/aethyme/rust/target/${{ matrix.target }}/release
          AETHYME_RELEASE_HELPER_BINARY_DIR: ${{ github.workspace }}/packages/aethyme/rust/target/${{ matrix.target }}/release/examples
        run: cargo test --locked -p aethyme-testkit --test release_contract

      - name: Verify embedded release versions
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          expected="${REF_NAME#v}"
          router_version="$(./target/${{ matrix.target }}/release/aethyme --version | awk '{print $2}')"
          engine_version="$(./target/${{ matrix.target }}/release/aethyme-engine-cli --version | awk '{print $2}')"
          test "$router_version" = "$expected"
          test "$engine_version" = "$expected"

      - name: Package archive
        env:
          # Tag names may contain shell metacharacters — never inline
          # github.ref_name into run: commands.
          REF_NAME: ${{ github.ref_name }}
        run: |
          tar -C "target/${{ matrix.target }}/release" -czf "aethyme-${REF_NAME}-${{ matrix.target }}.tar.gz" \
            aethyme aethyme-engine-cli

      - name: Smoke installed archive
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "$smoke_root"' EXIT
          tar -xzf "aethyme-${REF_NAME}-${{ matrix.target }}.tar.gz" -C "$smoke_root"
          "$smoke_root/aethyme" --version
          "$smoke_root/aethyme-engine-cli" --version
          "$smoke_root/aethyme" broker quick-test
          graph_repo="$smoke_root/graph-refresh"
          git init --quiet --initial-branch=main "$graph_repo"
          mkdir -p "$graph_repo/.aethyme"
          printf '[graph]\nauthority="committed_fragments"\nrepository="release-smoke"\n' > "$graph_repo/.aethyme/config.toml"
          printf '%s\n' "${REF_NAME#v}" > "$graph_repo/.aethyme/engine-version"
          printf 'def release_smoke():\n    return True\n' > "$graph_repo/app.py"
          git -C "$graph_repo" -c user.name='Aethyme Release' -c user.email='release@example.invalid' add -A
          git -C "$graph_repo" -c user.name='Aethyme Release' -c user.email='release@example.invalid' commit --quiet -m fixture
          "$smoke_root/aethyme" graph status --repo "$graph_repo" --json
          plan_sha="$("$smoke_root/aethyme" graph refresh plan --repo "$graph_repo" --json | sed -n 's/.*"plan_sha256": "\([0-9a-f]*\)".*/\1/p')"
          test "${#plan_sha}" = 64
          "$smoke_root/aethyme" graph refresh execute --repo "$graph_repo" --confirm "$plan_sha"
          test -f "$graph_repo/.aethyme/graph_store.redb"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aethyme-${{ matrix.target }}
          path: packages/aethyme/rust/aethyme-*-${{ matrix.target }}.tar.gz
          if-no-files-found: error

      - name: Upload release helper artifact
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-helpers-${{ github.sha }}
          path: packages/aethyme/rust/target/${{ matrix.target }}/release-helpers.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build (x86_64-pc-windows-msvc)
    needs: verify-green-main
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/aethyme/rust
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Build release binaries
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p aethyme-cli --bin aethyme -p aethyme-engine --bin aethyme-engine-cli -p aethyme-graph-indexer --bin aethyme-graph-index

      - name: Package and smoke installed zip
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $archive = "aethyme-$env:REF_NAME-x86_64-pc-windows-msvc.zip"
          Compress-Archive -Path "target/x86_64-pc-windows-msvc/release/aethyme.exe", "target/x86_64-pc-windows-msvc/release/aethyme-engine-cli.exe" -DestinationPath $archive -CompressionLevel Optimal
          $smokeRoot = Join-Path $env:RUNNER_TEMP "aethyme-windows-release"
          Expand-Archive -LiteralPath $archive -DestinationPath $smokeRoot -Force
          & "$env:GITHUB_WORKSPACE/scripts/windows-release-smoke.ps1" -RouterPath (Join-Path $smokeRoot "aethyme.exe") -EnginePath (Join-Path $smokeRoot "aethyme-engine-cli.exe") -IndexerPath (Join-Path (Join-Path $env:GITHUB_WORKSPACE "packages/aethyme/rust/target/x86_64-pc-windows-msvc/release") "aethyme-graph-index.exe")

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aethyme-x86_64-pc-windows-msvc
          path: packages/aethyme/rust/aethyme-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip
          if-no-files-found: error

  release:
    name: Attach to GitHub release
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Download artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'aethyme-*' --dir dist
          find dist -mindepth 2 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} dist/ \;
          find dist -mindepth 1 -type d -empty -delete
          tar_count="$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d ' ')"
          windows_count="$(find dist -maxdepth 1 -type f -name '*.zip' | wc -l | tr -d ' ')"
          # Five Unix archives plus the native Windows x64 zip.
          test "$tar_count" = "5"
          test "$windows_count" = "1"
          test -z "$(find dist -type f \( -name 'release_manifest' -o -name 'homebrew_formula' -o -name 'release-helpers.tar.gz' \) -print -quit)"

      - name: Download release helper artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          helper_artifact_dir="$RUNNER_TEMP/release-helper-artifact"
          helper_dir="$RUNNER_TEMP/aethyme-release-helpers"
          mkdir -p "$helper_artifact_dir" "$helper_dir"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "release-helpers-${GITHUB_SHA}" --dir "$helper_artifact_dir"
          helper_archive="$(find "$helper_artifact_dir" -type f -name 'release-helpers.tar.gz' -print -quit)"
          test -n "$helper_archive"
          test "$(find "$helper_artifact_dir" -type f -name 'release-helpers.tar.gz' | wc -l | tr -d ' ')" = "1"
          tar -xzf "$helper_archive" -C "$helper_dir"
          helper_source_sha="$(cat "$helper_dir/source.sha")"
          test "$helper_source_sha" = "$GITHUB_SHA"
          (cd "$helper_dir" && sha256sum --check SHA256SUMS)
          test -x "$helper_dir/release_manifest"
          test -x "$helper_dir/homebrew_formula"
          test ! -e dist/release_manifest
          test ! -e dist/homebrew_formula

      - name: Build release manifest and checksums
        env:
          REF_NAME: ${{ github.ref_name }}
          AETHYME_RELEASE_HELPER_DIR: ${{ runner.temp }}/aethyme-release-helpers
        run: |
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$GITHUB_SHA"
          case "$REF_NAME" in
            *-*) release_channel=preview ;;
            *) release_channel=stable ;;
          esac
          cp install.sh dist/install.sh
          "$AETHYME_RELEASE_HELPER_DIR/release_manifest" \
            --dist "$GITHUB_WORKSPACE/dist" \
            --tag "$REF_NAME" \
            --source-sha "$source_sha" \
            --channel "$release_channel" \
            --output "$GITHUB_WORKSPACE/dist/release-manifest.json"
          if [ "$release_channel" = stable ]; then
            "$AETHYME_RELEASE_HELPER_DIR/homebrew_formula" \
              --manifest "$GITHUB_WORKSPACE/dist/release-manifest.json" \
              --tag "$REF_NAME" \
              --source-sha "$source_sha" \
              --repo "$GITHUB_REPOSITORY" \
              --output "$GITHUB_WORKSPACE/dist/aethyme.rb"
          fi
          cd dist
          sha256sum --check SHA256SUMS

      - name: Install retry-safe legacy Cosign signer
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5
          install-dir: ${{ runner.temp }}/cosign-v2.6.5

      - name: Sign release assets with retry-safe legacy Cosign
        env:
          REF_NAME: ${{ github.ref_name }}
          COSIGN_V2: ${{ runner.temp }}/cosign-v2.6.5/cosign
        run: |
          set -euo pipefail
          signature_dir="$RUNNER_TEMP/aethyme-release-signatures"
          mkdir -p "$signature_dir"
          "$COSIGN_V2" sign-blob --yes --new-bundle-format=false --use-signing-config=false \
            --bundle "$signature_dir/release-manifest.legacy.json" \
            dist/release-manifest.json
          zip="dist/aethyme-${REF_NAME}-x86_64-pc-windows-msvc.zip"
          "$COSIGN_V2" sign-blob --yes --new-bundle-format=false --use-signing-config=false \
            --bundle "$signature_dir/aethyme-${REF_NAME}-x86_64-pc-windows-msvc.legacy.json" \
            "$zip"

      - name: Install standard-bundle converter and verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
          install-dir: ${{ runner.temp }}/cosign-v3.1.3

      - name: Create standard bundles and verify release assets
        env:
          REF_NAME: ${{ github.ref_name }}
          COSIGN_V3: ${{ runner.temp }}/cosign-v3.1.3/cosign
        run: |
          set -euo pipefail
          signature_dir="$RUNNER_TEMP/aethyme-release-signatures"
          "$COSIGN_V3" bundle create \
            --artifact dist/release-manifest.json \
            --bundle "$signature_dir/release-manifest.legacy.json" \
            --out dist/release-manifest.sigstore.json
          "$COSIGN_V3" verify-blob \
            --bundle dist/release-manifest.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${REF_NAME}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/release-manifest.json

          # The Windows zip is not listed in release-manifest.json (released
          # updaters reject a non-tarball entry), so it carries its own bundle.
          zip="dist/aethyme-${REF_NAME}-x86_64-pc-windows-msvc.zip"
          "$COSIGN_V3" bundle create \
            --artifact "$zip" \
            --bundle "$signature_dir/aethyme-${REF_NAME}-x86_64-pc-windows-msvc.legacy.json" \
            --out "$zip.sigstore.json"
          "$COSIGN_V3" verify-blob \
            --bundle "$zip.sigstore.json" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${REF_NAME}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$zip"

      - name: Render release notes
        # The body is the tag's CHANGELOG.md entry plus its UPGRADING.md
        # section when the release is breaking; the release version contract
        # checks the same renderer for the workspace version.
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          cargo run --locked --manifest-path packages/aethyme/rust/Cargo.toml \
            -p aethyme-testkit --example release_notes -- \
            --repo "$GITHUB_WORKSPACE" \
            --tag "$REF_NAME" \
            --output "$RUNNER_TEMP/release-notes.md"

      - name: Create or update release
        # Third-party action with a write-scoped token: pinned to a full
        # commit SHA rather than a movable tag.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Issue #253: keep the Homebrew tap in lock-step with each stable release.
  # homebrew-tap.yml verifies the signed manifest, regenerates the formula and
  # publishes it with a blob-SHA-guarded write plus byte-for-byte read-back;
  # re-run that workflow for the tag to retry. Preview tags (containing '-')
  # get no formula: Homebrew exposes one current version.
  homebrew-tap:
    name: Homebrew tap
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: read
    uses: ./.github/workflows/homebrew-tap.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      # Fine-grained PAT, contents:write on schiste/homebrew-tap only.
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
