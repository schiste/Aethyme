name: macOS tests

# The Rust workspace suite on macOS, the primary user platform, for every
# commit on main. Linux CI never saw macOS-only breakage; the nightly
# (macos-nightly.yml) saw it a day late, on one runner, in ~53 minutes.
#
# Not on pull requests: the per-pull-request macOS job removed on 2026-10-06
# waited 6-10 min for a runner and blocked every merge on it. Here it runs
# after the merge and blocks nothing.
#
# Not a required check and not a release gate (yet): it has never been green,
# and release verification reads only Aethyme Gates' full-suite record. Make
# it one only after it has been reliably green.
#
# Shape: the commands and jobs of aethyme-gates.yml's cargo-test gate, on
# macos-15. One job compiles the suite once into a nextest archive, six shard
# jobs each run one hash partition of it, one job runs examples and doctests,
# and `macos-tests` gives the one verdict. The nightly took 3187 s of test
# time on one runner; six partitions bring each shard to roughly 9 min, so
# the run takes about the build plus one shard (~25-35 min including the
# macOS runner queue) instead of ~55 min. `macos_tests_run_the_workspace_suite_on_main`
# in aethyme-testkit's ci_validation.rs keeps the commands equal to the
# Linux shards'.
#
# The Linux jobs use GNU tools (`sha256sum`, `stat -c`, `tar --zstd`); these
# use what macOS ships (`shasum -a 256`, `wc -c`, bsdtar). The archive itself
# is written and read by cargo-nextest, which needs no zstd binary.
#
# No untrusted event data (`github.event.*`) is interpolated into any
# `run:` block here — every step is a fixed command.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# Retry transient registry and git fetch failures instead of failing the job
# on one dropped connection (Cargo's default is 3).
env:
  CARGO_NET_RETRY: "10"

# One group per commit: every commit on main gets a completed verdict.
# Cancelling superseded runs left merge commits with no verdict at all
# (aethyme-gates.yml, 2026-09-23), and a macOS break must be attributable to
# the commit that introduced it.
concurrency:
  group: macos-tests-${{ github.sha }}
  cancel-in-progress: false

jobs:
  macos-tests-build:
    name: macOS tests (build)
    runs-on: macos-15
    defaults:
      run:
        working-directory: packages/aethyme/rust
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Same history as the shards, so build scripts see the same tree.
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      # A macOS-only key: it never restores or overwrites the Linux
      # `rust-tests` entry. This job is the one that saves it, from main.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: packages/aethyme/rust
          shared-key: rust-tests-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        id: nextest_install
        continue-on-error: true
        timeout-minutes: 3
        uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-nextest@0.9.146

      - name: Retry cargo-nextest installation
        if: steps.nextest_install.outcome == 'failure'
        timeout-minutes: 3
        uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-nextest@0.9.146

      # Install once per workflow run; every shard uses the exact same binary.
      - name: Stage cargo-nextest for the shards
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nextest-tool"
          install -m 0755 "$(command -v cargo-nextest)" "$RUNNER_TEMP/nextest-tool/cargo-nextest"
          cd "$RUNNER_TEMP/nextest-tool"
          shasum -a 256 cargo-nextest > SHA256SUMS

      - name: Upload cargo-nextest for the shards
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-tests-nextest
          path: ${{ runner.temp }}/nextest-tool/
          retention-days: 1
          if-no-files-found: error

      # Set on this step only: rust-cache keys on CARGO_* variables present when
      # it restores.
      - name: Build the test archive
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: ../scripts/test-like-ci.sh --archive "$RUNNER_TEMP/rust-tests.tar.zst"

      # Best effort: bsdtar reads zstd through libarchive or the zstd binary;
      # without either, the binary count is reported as unavailable.
      - name: Record the build facts
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/rust-tests.tar.zst"
          bytes=$(wc -c < "$archive" | tr -d ' ')
          if listing="$(tar -tf "$archive")"; then
            binaries=$(printf '%s\n' "$listing" | grep -c '^target/debug/deps/' || true)
          else
            binaries=null
          fi
          mkdir -p "$RUNNER_TEMP/rust-tests-build"
          printf '{"archive_bytes": %s, "test_binaries": %s}\n' "$bytes" "$binaries" \
            > "$RUNNER_TEMP/rust-tests-build/build.json"
          cp target/cargo-timings/cargo-timing.html "$RUNNER_TEMP/rust-tests-build/"
          echo "Archive: $((bytes / 1048576)) MiB, $binaries test binaries"

      - name: Upload the test archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-tests-archive
          path: ${{ runner.temp }}/rust-tests.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload the build telemetry
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-tests-build
          path: ${{ runner.temp }}/rust-tests-build/
          if-no-files-found: error
          retention-days: 14

  macos-tests-shard:
    name: macOS tests (shard ${{ matrix.shard }}/6)
    needs: macos-tests-build
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: macos-15
    defaults:
      run:
        working-directory: packages/aethyme/rust
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # A few tests run cargo themselves.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Download cargo-nextest from the build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-tests-nextest
          path: ${{ runner.temp }}/nextest-tool

      - name: Verify and install cargo-nextest
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/nextest-tool"
          shasum -a 256 --check SHA256SUMS
          mkdir -p "$HOME/.cargo/bin"
          install -m 0755 cargo-nextest "$HOME/.cargo/bin/cargo-nextest"
          cargo nextest --version

      - name: Download the test archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-tests-archive
          path: ${{ runner.temp }}/rust-tests-archive

      - name: Run workspace tests
        run: ../scripts/test-like-ci.sh --from-archive "$RUNNER_TEMP/rust-tests-archive/rust-tests.tar.zst" --partition "hash:${{ matrix.shard }}/6"

      - name: Upload the shard report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-tests-junit-shard-${{ matrix.shard }}
          path: packages/aethyme/rust/target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 14

  # nextest runs neither example targets nor doctests.
  macos-tests-examples-doctests:
    name: macOS tests (examples and doctests)
    runs-on: macos-15
    defaults:
      run:
        working-directory: packages/aethyme/rust
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      # Restores the entry macos-tests-build saves from main.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: packages/aethyme/rust
          shared-key: rust-tests-macos
          save-if: false

      - name: Run example tests
        run: cargo test --locked --workspace --examples

      - name: Run doctests
        run: cargo test --locked --workspace --doc

  # The one verdict, and the shard balance and slowest tests. Job timings need
  # `actions: read`, which this workflow does not take, so they are reported
  # as unavailable.
  macos-tests:
    name: macOS tests
    needs: [macos-tests-build, macos-tests-shard, macos-tests-examples-doctests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require every part of the suite
        env:
          BUILD: ${{ needs.macos-tests-build.result }}
          SHARDS: ${{ needs.macos-tests-shard.result }}
          EXAMPLES: ${{ needs.macos-tests-examples-doctests.result }}
        run: |
          set -euo pipefail
          echo "build=$BUILD shards=$SHARDS examples=$EXAMPLES"
          [[ "$BUILD" == success && "$SHARDS" == success && "$EXAMPLES" == success ]]

      - name: Download the shard reports
        if: ${{ always() && needs.macos-tests-build.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rust-tests-junit-shard-*
          path: ${{ runner.temp }}/rust-tests-junit

      - name: Download the build telemetry
        if: ${{ always() && needs.macos-tests-build.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-tests-build
          path: ${{ runner.temp }}/rust-tests-build

      # Best effort: the step above decided this workflow's verdict.
      - name: Summarize the run
        if: ${{ always() && needs.macos-tests-build.result == 'success' }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/rust-test-telemetry"
          mkdir -p "$out"
          if python3 .github/scripts/rust-test-telemetry.py \
            --junit-dir "$RUNNER_TEMP/rust-tests-junit" \
            --build-json "$RUNNER_TEMP/rust-tests-build/build.json" \
            --markdown "$out/summary.md" \
            --json "$out/rust-test-telemetry.json"; then
            cat "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::The macOS test telemetry could not be summarized."
          fi

      - name: Upload the run telemetry
        if: ${{ always() && needs.macos-tests-build.result == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-test-telemetry
          path: ${{ runner.temp }}/rust-test-telemetry/
          if-no-files-found: warn
          retention-days: 90
