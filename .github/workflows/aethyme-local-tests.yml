name: Aethyme Local Tests

on:
  pull_request:
    paths:
      - "packages/aethyme/**"
      - ".github/workflows/aethyme-local-tests.yml"
  push:
    branches: ["main", "master"]
    paths:
      - "packages/aethyme/**"
      - ".github/workflows/aethyme-local-tests.yml"

jobs:
  local-tests-default:
    name: Local tests (default lane)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/aethyme
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The documented dev setup uses a package-local .venv (the layout the
      # broker gates and docs assume), so CI provides the same venv layout.
      - name: Install package + dev dependencies (into .venv)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Run local test suite (default lane)
        run: .venv/bin/python -m pytest -q tests/local

  local-tests-strict-engine:
    name: Local tests (strict engine lane)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/aethyme
    env:
      AETHYME_REQUIRE_LOCAL_ENGINE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install package + dev dependencies (into .venv)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Build Rust engine binary
        run: cargo build --quiet --manifest-path rust/Cargo.toml --bin aethyme-engine-cli

      - name: Run strict engine local tests
        run: .venv/bin/python -m pytest -q tests/local
