name: Aethyme Local Tests

# The implementation-blind suites that drive the built `aethyme` binary.
# They were pytest until python-retirement Phase 7 (2026-08-06); they are
# now Rust integration tests in `aethyme-cli/tests/` and
# `aethyme-testkit/tests/`, so this lane installs no Python.
#
# Manual diagnostic lane: these suites already run in the full workspace
# on PRs (OSS CI) and main (Aethyme Gates). The distinct no-Python product
# proof remains automatic in oss-ci.yml.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binary-driven-tests:
    name: Binary-driven tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/aethyme/rust
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The suites resolve `aethyme`, `aethyme-engine-cli` and
      # `aethyme-graph-index` through `aethyme_testkit::bins`, which builds
      # them on demand. Building them up front keeps the cost visible as a
      # build step instead of hiding it inside the first test.
      - name: Build the binaries the suites drive
        run: cargo build --locked --quiet --bin aethyme --bin aethyme-engine-cli --bin aethyme-graph-index

      # `-p aethyme-cli -p aethyme-testkit` is the ported pytest surface:
      # the CLI suites and the repo-hygiene suites. The rest of the
      # workspace is covered automatically by OSS CI and Aethyme Gates.
      - name: Run the binary-driven suites
        run: cargo test --locked -p aethyme-cli -p aethyme-testkit
