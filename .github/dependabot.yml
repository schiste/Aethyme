# Recovery plan P1.5: weekly update PRs for GitHub Actions (pinned to commit
# SHAs) and the Rust workspace lockfile.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /packages/aethyme/rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-patch:
        update-types: ["patch"]
    # Only patch releases arrive automatically. For 0.x crates a minor bump is
    # breaking (oxc, tree-sitter), and some majors change on-disk formats
    # (bincode backs the graph store), so those are upgraded deliberately.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
