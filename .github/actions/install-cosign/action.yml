name: Install verified Cosign
description: Restore a pinned Cosign binary or install it with upstream verification
inputs:
  version:
    description: Supported pinned Cosign release
    required: true
runs:
  using: composite
  steps:
    - name: Validate pinned version
      id: pin
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        case "$VERSION" in
          v2.6.5) digest=c3b4f5410e608af03a5eb0aaac84a4313d8da131248e08ff1759ac70c79d1644 ;;
          v3.1.3) digest=4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71 ;;
          *) echo "Unsupported Cosign version: $VERSION" >&2; exit 1 ;;
        esac
        test "$RUNNER_OS" = Linux && test "$RUNNER_ARCH" = X64
        echo "digest=$digest" >> "$GITHUB_OUTPUT"
    - name: Restore Cosign cache
      id: cache
      continue-on-error: true
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/cosign-${{ inputs.version }}
        key: aethyme-cosign-linux-amd64-${{ inputs.version }}-${{ steps.pin.outputs.digest }}
    - name: Check restored binary
      id: restored
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        DIGEST: ${{ steps.pin.outputs.digest }}
      run: |
        set -euo pipefail
        binary="$RUNNER_TEMP/cosign-$VERSION/cosign"
        if test -f "$binary" && printf '%s  %s\n' "$DIGEST" "$binary" | sha256sum --check --status; then
          echo 'valid=true' >> "$GITHUB_OUTPUT"
        else
          rm -f "$binary"
          echo 'valid=false' >> "$GITHUB_OUTPUT"
        fi
    - name: Install Cosign from upstream
      id: upstream_install
      if: steps.restored.outputs.valid != 'true'
      continue-on-error: true
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: ${{ inputs.version }}
        install-dir: ${{ runner.temp }}/cosign-${{ inputs.version }}
    - name: Retry Cosign installation
      if: steps.restored.outputs.valid != 'true' && steps.upstream_install.outcome == 'failure'
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: ${{ inputs.version }}
        install-dir: ${{ runner.temp }}/cosign-${{ inputs.version }}
    - name: Verify pinned binary and expose it
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        DIGEST: ${{ steps.pin.outputs.digest }}
      run: |
        set -euo pipefail
        binary="$RUNNER_TEMP/cosign-$VERSION/cosign"
        printf '%s  %s\n' "$DIGEST" "$binary" | sha256sum --check
        chmod 0755 "$binary"
        echo "$RUNNER_TEMP/cosign-$VERSION" >> "$GITHUB_PATH"
    - name: Save verified Cosign cache
      if: steps.cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/cosign-${{ inputs.version }}
        key: aethyme-cosign-linux-amd64-${{ inputs.version }}-${{ steps.pin.outputs.digest }}
