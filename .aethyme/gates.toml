# Gates for the Aethyme monorepo (dogfood config — issue #33).
#
# Contract notes:
# - Commands run with cwd = the worktree being verified — including the
#   throwaway merge-simulation worktrees — so nothing here may assume the
#   main checkout's cwd. Gates used to borrow the main checkout's
#   interpreter through $MAIN because linked worktrees have no .venv;
#   that coupling is gone (python-retirement Phase 7, 2026-08-06). The
#   only Python left in this repo is `packages/aethyme-eval`, and its
#   gate provisions a venv inside the tree under test, so a gate always
#   runs the dependencies of the diff it is verifying — closing the v0
#   caveat that a dependency-changing diff could pass against the main
#   checkout's environment.
# - Rust gates use broker-managed, repository-scoped caches. The contract
#   check has a separate cache from workspace tests. The broker exports each
#   safe path, serializes writers for that cache across clones, reports cache
#   provenance, and rotates before a run when the 12 GiB budget is exceeded.
#   Authoritative disposable builds keep incremental compilation disabled and
#   reduce debug information so useful artifacts stay compact.
# - Gate outputs must be gitignored or they change the working-tree hash
#   and bust the result cache.
# - Gate commands receive AETHYME_GATE_WORKER_ID and AETHYME_TEST_DB_SUFFIX.
#   Any gate that uses a test database or external namespace must suffix it
#   with that value; fixed shared test DB names are unsafe under broker load.
# - Every command exports CHAU7_CTO_OPTIM_ACTIVE=1: Chau7's CTO git
#   wrapper compresses git output in agent tabs (chau7#77), and gates —
#   or the tests they run — that parse git output would read fiction.
#   Blanket insurance until the wrapper passes through non-TTY output.

# The `ruff` and `pytest-local` gates were removed on 2026-08-06
# (python-retirement Phase 7) together with the dev pytest stack they ran:
# `packages/aethyme` holds no Python, so there is nothing for ruff to lint
# and no pytest tree to collect. The implementation-blind suites they
# guarded now live in `packages/aethyme/rust/crates/{aethyme-cli,
# aethyme-testkit}/tests/` and run under `cargo-test`, whose triggers
# (`**/*.rs`, `**/Cargo.toml`) already covered the Rust changes that used
# to be the reason `pytest-local` triggered on `packages/aethyme/rust/**`.
# `packages/aethyme/skills/**` is still covered: the ported
# skill-template and playground-hygiene suites read those files, and
# `cargo-test` runs the whole workspace on every entry that touches Rust.

[[gate]]
# Dogfood catch 2026-07-14: a NEW top-level package matched no trigger, so
# its submit verified with gates:[] and auto-promoted unchecked. Every
# package gets its own gate; when adding a package, add its gate in the
# same change.
# 2026-08-06 (python-retirement Phase 7): this gate used to borrow
# `$MAIN/packages/aethyme/.venv`. That venv is an artifact of a package
# that no longer contains any Python, and the CI gates lane stopped
# creating it, so the borrow had to end. aethyme-eval is Python by
# operator decision, so it provisions its own venv — inside the worktree
# under test, which also means the gate runs the dependencies of the diff
# it is verifying rather than the main checkout's. The venv is gitignored,
# so it does not change the tree hash the result cache keys on. Creating
# it costs ~2s once per worktree; every run after that reuses it.
# Pin pytest because its version affects evaluation behavior. The command is
# part of this gate's definition hash, so changing the pin invalidates verdicts.
name = "pytest-aethyme-eval"
command = 'export CHAU7_CTO_OPTIM_ACTIVE=1 && cd packages/aethyme-eval && { [ -x .venv/bin/python ] || python3 -m venv .venv; } && { .venv/bin/python -c "import importlib.metadata as m; assert m.version(\"pytest\") == \"9.1.1\"" || .venv/bin/python -m pip install --quiet --disable-pip-version-check pytest==9.1.1; } && PYTHONPATH=src .venv/bin/python -m pytest -q tests'
cost = 1
timeout_seconds = 300
triggers = ["packages/aethyme-eval/**"]

[[gate]]
# 2026-09-27: 7 of the 21 failing `cargo-test` runs in the preceding 24 h
# were found only after the ~10-minute workspace suite, by guards that take
# seconds: `help_snapshots` (4x) and `broker_discarded_results` (3x). Gates
# run cheap-first and stop at the first failure (`run_affected` in
# `aethyme-broker/src/gates.rs`), so this gate puts the fast, deterministic
# guard suites ahead of the full suite and a failing guard stops the entry
# before the expensive run starts.
#
# Cost 2, not 1: the pre-commit hook runs every gate of cost 1 or less, and
# a Cargo build does not belong at commit time. Below cargo-test's 3, so it
# runs first.
#
# Same environment prefix, `--workspace` selection and managed cache as
# `cargo-test`, chosen so both resolve features and fingerprint artifacts
# the same way: what this gate builds is meant to be what `cargo-test` then
# reuses, so a passing entry pays for the guard run, not a second build.
#
# Measured 2026-09-27 with this exact command, load average 55-110 from
# concurrent builds: 279 s cold (empty cache, 1.1 GiB of artifacts), 10.6 s
# warm, of which the ten suites themselves take under 12 s combined (every
# suite finishes in under 5 s). Each suite is deterministic: it reads tracked
# files or drives the built binary in a throwaway repository.
#
# COUPLING: the triggers include every `cargo-test` trigger, so each entry that
# runs the full local suite runs these guards first. When a trigger is added to
# `cargo-test`, add it here; `gate_policy.rs`
# (`fast_guards_precede_cargo_test_on_every_path_it_covers`) fails
# otherwise, and names the suites this command must keep. Every suite here
# also runs under `cargo-test`, so nothing is lost if this gate is removed.
# Local Rust gates bound compilation and test execution separately. Keep
# these defaults explicit so an inherited environment cannot fan out workers.
# Every Rust gate opens with the same sizing step (see `cargo-test`, 2026-11-07):
# the broker's AETHYME_GATE_IDLE_CPUS becomes 2-8 test workers and 1-4 build
# jobs, and its absence keeps one job and two workers.
# 2026-11-08: the pre-push tier. Testing is split in three:
#   pre-push (this gate, before a submission is promoted): format check, a
#     compile of every test target, and the tests
#     `packages/aethyme/scripts/prepush-selection.sh` picks: the repository
#     lint suites, the modules with the most failing CI runs per second, and
#     the modules the change touches, within 15% of suite time;
#   push to main (Aethyme Gates): the changed crates and their reverse
#     dependencies, sharded, plus lint, examples and doctests;
#   release (a version bump, or a dispatch): the whole workspace.
# Measured on 845 failing pull-request runs (2026-09-10 to 2026-11-08): 45%
# failed before any test ran (293 compile, 44 fmt, 42 clippy), which the
# compile and format steps here catch, and the test selection caught 89% of
# the test-failing runs after 2026-10-20 at a mean of 10% of suite time. The
# ten guard suites below are in its always-run set; without nextest the gate
# falls back to running just them.
name = "fast-guards"
command = 'gi="${AETHYME_GATE_IDLE_CPUS:-0}"; case "$gi" in *[!0-9]*|"") gi=0 ;; ?????*) gi=16 ;; esac; gt=$gi; [ "$gt" -ge 2 ] || gt=2; [ "$gt" -le 8 ] || gt=8; gj=$((gi / 2)); [ "$gj" -ge 1 ] || gj=1; [ "$gj" -le 4 ] || gj=4; export CHAU7_CTO_OPTIM_ACTIVE=1 CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS="${AETHYME_GATE_BUILD_JOBS:-$gj}" RUST_TEST_THREADS="${AETHYME_GATE_TEST_THREADS:-$gt}" NEXTEST_TEST_THREADS="${AETHYME_GATE_TEST_THREADS:-$gt}" CARGO_PROFILE_DEV_DEBUG=1 CARGO_PROFILE_TEST_DEBUG=1 CARGO_TARGET_DIR="$AETHYME_GATE_CACHE_DIR" && m=packages/aethyme/rust/Cargo.toml && cargo fmt --all --check --manifest-path "$m" && if cargo nextest --version >/dev/null 2>&1; then sel="$(packages/aethyme/scripts/prepush-selection.sh --base aethyme/integration)" && cargo build --locked --workspace --bins --quiet --manifest-path "$m" && AETHYME_TESTKIT_PREBUILT_BINS=1 cargo nextest run --locked --workspace --profile local --build-jobs "$CARGO_BUILD_JOBS" --no-fail-fast --no-tests warn --cargo-quiet --manifest-path "$m" -E "$sel"; else cargo test --locked --workspace --examples --quiet --manifest-path packages/aethyme/rust/Cargo.toml --test help_snapshots --test help_surface --test help_everywhere --test broker_discarded_results --test deprecated_spelling_callers --test docs_hygiene --test no_eval_tuning --test pr_template --test grammar_provenance --test gate_policy; fi'
cost = 2
timeout_seconds = 2400
resource_wait_seconds = 900
triggers = [
    ".aethyme/gates.toml",
    "**/*.rs",
    "**/Cargo.toml",
    "packages/aethyme/skills/**",
    ".claude/skills/**",
    ".codex/skills/**",
    "packages/aethyme/scripts/eval/*.sh",
    "packages/aethyme/docs/**",
    ".github/pull_request_template.md",
    "packages/aethyme/rust/grammars/**",
]

[gate.managed_cache]
key = "rust-workspace-v3"
max_bytes = 12884901888

# 2026-11-12: every Rust gate draws its cost from the host build pool, the
# same pool `packages/aethyme/scripts/with-host-capacity.sh` reserves for a
# local cargo run (limit 6). Before this a gate and any number of local
# builds compiled at once: `cost` only orders gates and bounds this
# repository's own gate scheduler. Units equal the gate's cost, and
# `gate_policy.rs` (`every_rust_gate_draws_its_cost_from_the_host_build_pool`)
# keeps the pool, units and limit in step with the script.
[[gate.resources]]
key = "host_build"
kind = "capacity"
pool = "aethyme-host-build"
units = 2
limit = 6

[[gate]]
name = "cargo-test"
# 2026-11-05: Aethyme Gates no longer runs this command on main. It takes 20
# minutes on one saturated runner, so the workflow runs the same suites as jobs:
# one compile, then partitions on separate runners, as pull requests do
# (`the_cargo_test_jobs_run_the_pull_request_suite` in ci_validation.rs). This
# command remains available for gate-policy changes and explicit local runs.
# Routine submissions use fast guards; main CI retains the full sharded suite.
# 2026-09-29: --no-fail-fast. Without it the run stops at the first failing
# test binary, so a change breaking several suites surfaced one per submit:
# session 716 took 10 submits and 5 h 45 m, each revealing a new binary (#411).
# 2026-10-01: the workspace suite and the example tests are two runs. A single
# `cargo test --workspace --examples` (8b41bf8f) restricts Cargo to example
# targets, so from 2026-09-30 this gate ran three example binaries and no
# library, binary or integration test. Both runs always execute, and the gate
# fails if either does, so one pass still reports every failing suite.
# 2026-10-06: the workspace suite runs under nextest when it is installed,
# as CI's pull-request job already does (`oss-ci.yml`). `cargo test` runs one
# test binary at a time; nextest schedules every test of every binary at
# once. On GitHub's runner this gate took 1004 s under `cargo test` while the
# pull-request job ran the same suite in about 5 minutes. The product
# binaries are built once first and the tests use them
# (AETHYME_TESTKIT_PREBUILT_BINS, aethyme-testkit/src/bins.rs): nextest runs
# each test in its own process, and without them every process would queue
# its own `cargo build`. nextest runs no doctests, so they run separately.
# Without nextest the gate runs `cargo test` with the same worker cap; the
# local nextest profile is selected explicitly, with two test workers and no
# retries. Compilation is independently limited to one job.
# CARGO_PROFILE_DEV_DEBUG matches the test profile so the binaries and the
# tests share one set of compiled dependencies.
# 2026-11-04: AETHYME_GATE_BUILD_JOBS and AETHYME_GATE_TEST_THREADS raise the
# bounds of every Rust gate where a host is known to be dedicated to them; only
# aethyme-gates.yml sets them. Without them the bounds stay at one build job and
# two test workers, and inherited CARGO_BUILD_JOBS or NEXTEST_TEST_THREADS still
# cannot change them. The bounds protect a shared workstation, but they left
# GitHub's 4-core runner at a load of about 1 while this gate used 2292-2400 s
# of its 2400 s limit, and timed out on main three times that day.
# 2026-11-07: the fixed bounds could no longer finish locally either. The suite
# holds 73 minutes of test time (7,126 tests in CI's JUnit, 2026-11-07), so two
# workers need at least 2,200 s before the build, doctests and examples. This
# gate's last local pass was 2026-10-08 (395 s, before the bounds, at 3,874
# tests); every run from then to 2026-11-07 failed or was cut off, and the
# timeouts since 2026-10-29 started at 0.4-2.4 load per CPU. One killed run had
# judged 4,099 of 6,999 tests. Two changes:
# - Sizing. The broker exports AETHYME_GATE_IDLE_CPUS (logical CPUs minus the
#   one-minute load at start; absent when unmeasured). Test workers are that
#   count clamped to 2-8, build jobs half of it clamped to 1-4. Most of the
#   suite waits on git and SQLite rather than the CPU, so workers track idle
#   CPUs, not a fraction of them. A busy host still gets one job and two
#   workers, and AETHYME_GATE_BUILD_JOBS / AETHYME_GATE_TEST_THREADS still
#   override both.
# - Selection. nextest runs what `test-like-ci.sh --print-selection` reports
#   against aethyme/integration: the changed crates and their reverse
#   dependencies, plus the suites that read changed repository files. A
#   repository-wide input, no merge base or no change runs the whole workspace.
#   Doctests and examples always run the whole workspace. This gate is a local
#   pre-check when explicitly selected: Aethyme Gates on main runs the full
#   suite, so a narrowing here can delay detection until after merge.
#   The verdict is cached by tree like every gate. The tree judged is the merge
#   candidate, which changes whenever its base does, so a cached verdict is
#   reused only for the same merged content.
command = 'gi="${AETHYME_GATE_IDLE_CPUS:-0}"; case "$gi" in *[!0-9]*|"") gi=0 ;; ?????*) gi=16 ;; esac; gt=$gi; [ "$gt" -ge 2 ] || gt=2; [ "$gt" -le 8 ] || gt=8; gj=$((gi / 2)); [ "$gj" -ge 1 ] || gj=1; [ "$gj" -le 4 ] || gj=4; export CHAU7_CTO_OPTIM_ACTIVE=1 CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS="${AETHYME_GATE_BUILD_JOBS:-$gj}" RUST_TEST_THREADS="${AETHYME_GATE_TEST_THREADS:-$gt}" NEXTEST_TEST_THREADS="${AETHYME_GATE_TEST_THREADS:-$gt}" CARGO_PROFILE_DEV_DEBUG=1 CARGO_PROFILE_TEST_DEBUG=1 CARGO_TARGET_DIR="$AETHYME_GATE_CACHE_DIR" && m=packages/aethyme/rust/Cargo.toml; if cargo nextest --version >/dev/null 2>&1; then sel="$(packages/aethyme/scripts/test-like-ci.sh --base aethyme/integration --print-selection)" || sel=; case "$sel" in none|workspace) sel= ;; esac; cargo build --locked --workspace --bins --quiet --manifest-path "$m" && if [ -z "$sel" ]; then AETHYME_TESTKIT_PREBUILT_BINS=1 cargo nextest run --locked --workspace --profile local --build-jobs "$CARGO_BUILD_JOBS" --no-fail-fast --cargo-quiet --manifest-path "$m"; else echo "cargo-test: testing what changed since aethyme/integration: $sel"; AETHYME_TESTKIT_PREBUILT_BINS=1 cargo nextest run --locked --workspace --profile local --build-jobs "$CARGO_BUILD_JOBS" --no-fail-fast --no-tests warn --cargo-quiet --manifest-path "$m" -E "$sel"; fi; suite=$?; cargo test --locked --workspace --doc --quiet --no-fail-fast --manifest-path "$m"; doc=$?; else cargo test --locked --workspace --quiet --no-fail-fast --manifest-path "$m"; suite=$?; doc=0; fi; cargo test --locked --workspace --examples --quiet --no-fail-fast --manifest-path "$m"; examples=$?; [ "$suite" -eq 0 ] && [ "$doc" -eq 0 ] && [ "$examples" -eq 0 ]'
cost = 3
# 2026-09-26: raised from 1200. A full workspace run took 1056 s on a passing
# gate that day and hit 1200 four times (sessions 677, 684, 621) while other
# repositories' builds held the load average at 30-70. The limit exists to
# stop a hung gate, not to time a healthy one under load.
timeout_seconds = 2400
resource_wait_seconds = 900
# Changes to gate policy still exercise the full local gate. Other changes
# run the contract and fast guards locally; main CI runs the complete suite.
triggers = [".aethyme/gates.toml"]

[gate.managed_cache]
key = "rust-workspace-v3"
max_bytes = 12884901888

[[gate.resources]]
key = "host_build"
kind = "capacity"
pool = "aethyme-host-build"
units = 3
limit = 6

[[gate]]
# Shell/jq-only changes must exercise the trust/privacy contracts they change,
# without selecting the full workspace suite. This does not remove any gate.
name = "script-contract"
command = 'gi="${AETHYME_GATE_IDLE_CPUS:-0}"; case "$gi" in *[!0-9]*|"") gi=0 ;; ?????*) gi=16 ;; esac; gt=$gi; [ "$gt" -ge 2 ] || gt=2; [ "$gt" -le 8 ] || gt=8; gj=$((gi / 2)); [ "$gj" -ge 1 ] || gj=1; [ "$gj" -le 4 ] || gj=4; export CHAU7_CTO_OPTIM_ACTIVE=1 CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS="${AETHYME_GATE_BUILD_JOBS:-$gj}" RUST_TEST_THREADS="${AETHYME_GATE_TEST_THREADS:-$gt}" NEXTEST_TEST_THREADS="${AETHYME_GATE_TEST_THREADS:-$gt}" CARGO_PROFILE_TEST_DEBUG=1 CARGO_TARGET_DIR="$AETHYME_GATE_CACHE_DIR" && cargo test --locked --quiet --manifest-path packages/aethyme/rust/Cargo.toml -p aethyme-testkit --test release_contract installer_ && cargo test --locked --quiet --manifest-path packages/aethyme/rust/Cargo.toml -p aethyme-testkit --test pilot_report'
cost = 1
timeout_seconds = 300
resource_wait_seconds = 900
triggers = ["install.sh", "scripts/pilot-*.jq", "packages/aethyme/rust/crates/aethyme-testkit/tests/release_contract.rs", "packages/aethyme/rust/crates/aethyme-testkit/tests/pilot_report.rs"]

[gate.managed_cache]
key = "rust-workspace-v3"
max_bytes = 12884901888

[[gate.resources]]
key = "host_build"
kind = "capacity"
pool = "aethyme-host-build"
units = 1
limit = 6

[[gate]]
# 2026-09-13: `.github/workflows/**` matched no trigger, so an entry that
# touched only a workflow file selected no Rust gate and auto-promoted
# without the suites that assert over that very file — the third instance
# of the silent-narrowing family already documented twice above (the
# untriggered new package, and `pytest-local`'s `src/**` outliving `src/`).
# Caught when entry 473 changed oss-ci.yml and ran one 37s gate; the test
# reading oss-ci.yml never executed, and passed only by luck.
#
# This is a narrow gate rather than a `.github/workflows/**` entry on
# `cargo-test` because the whole workspace suite costs ~10 minutes and this
# pair costs ~30s warm. The repository's own guidance is that a required
# check must be scoped to the diff and finish in minutes; charging every
# workflow edit the full suite would violate it to cover two files.
#
# COUPLING: this gate names the suites that read `.github/` from
# `repo_root()`. A new test that reads a workflow file must be added here,
# or it is unguarded on the workflow-only path. These suites also run under
# `cargo-test`, so nothing here is lost when Rust changes.
name = "workflow-contract"
command = 'gi="${AETHYME_GATE_IDLE_CPUS:-0}"; case "$gi" in *[!0-9]*|"") gi=0 ;; ?????*) gi=16 ;; esac; gt=$gi; [ "$gt" -ge 2 ] || gt=2; [ "$gt" -le 8 ] || gt=8; gj=$((gi / 2)); [ "$gj" -ge 1 ] || gj=1; [ "$gj" -le 4 ] || gj=4; export CHAU7_CTO_OPTIM_ACTIVE=1 CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS="${AETHYME_GATE_BUILD_JOBS:-$gj}" RUST_TEST_THREADS="${AETHYME_GATE_TEST_THREADS:-$gt}" NEXTEST_TEST_THREADS="${AETHYME_GATE_TEST_THREADS:-$gt}" CARGO_PROFILE_TEST_DEBUG=1 CARGO_TARGET_DIR="$AETHYME_GATE_CACHE_DIR" && cargo test --locked --quiet --manifest-path packages/aethyme/rust/Cargo.toml -p aethyme-testkit --test release_contract --test ci_validation && cargo test --locked --quiet --manifest-path packages/aethyme/rust/Cargo.toml -p aethyme-cli --test repository_deploy_cli'
cost = 1
timeout_seconds = 600
resource_wait_seconds = 900
triggers = [".github/workflows/**"]

[gate.managed_cache]
key = "rust-workspace-v3"
max_bytes = 12884901888

[[gate.resources]]
key = "host_build"
kind = "capacity"
pool = "aethyme-host-build"
units = 1
limit = 6

[[gate]]
# 2026-09-13: this file matched no trigger, so an entry that rewrote gate
# policy selected only the always-on gates — the gate being weakened never
# ran to object. Fourth instance of the silent-narrowing family documented
# above (the untriggered new package, `pytest-local`'s `src/**` outliving
# `src/`, and `.github/workflows/**` one day earlier). The config is source:
# editing it changes which gates run, so it needs a gate of its own.
#
# `gate_policy.rs` is the only suite that reads the LIVE config; every other
# gates test writes a fixture into a temp repository, which is why a broken
# policy could never fail a test. It asserts two things this file has now
# gotten wrong four times: that `.aethyme/gates.toml` is reachable by some
# trigger, and that no trigger glob has outlived the paths it named.
#
# Narrow rather than an entry on `cargo-test`: the workspace suite costs
# ~10 minutes and this one costs seconds warm. The repository's own rule is
# that a required check must be scoped to the diff and finish in minutes.
#
# COUPLING: the suite also runs under `cargo-test`, so nothing here is lost
# when Rust changes; this gate only adds the config-only path.
name = "gate-policy"
command = 'gi="${AETHYME_GATE_IDLE_CPUS:-0}"; case "$gi" in *[!0-9]*|"") gi=0 ;; ?????*) gi=16 ;; esac; gt=$gi; [ "$gt" -ge 2 ] || gt=2; [ "$gt" -le 8 ] || gt=8; gj=$((gi / 2)); [ "$gj" -ge 1 ] || gj=1; [ "$gj" -le 4 ] || gj=4; export CHAU7_CTO_OPTIM_ACTIVE=1 CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS="${AETHYME_GATE_BUILD_JOBS:-$gj}" RUST_TEST_THREADS="${AETHYME_GATE_TEST_THREADS:-$gt}" NEXTEST_TEST_THREADS="${AETHYME_GATE_TEST_THREADS:-$gt}" CARGO_PROFILE_TEST_DEBUG=1 CARGO_TARGET_DIR="$AETHYME_GATE_CACHE_DIR" && cargo test --locked --quiet --manifest-path packages/aethyme/rust/Cargo.toml -p aethyme-broker --test gate_policy'
cost = 1
timeout_seconds = 600
resource_wait_seconds = 900
triggers = [".aethyme/gates.toml"]

[gate.managed_cache]
key = "rust-workspace-v3"
max_bytes = 12884901888

[[gate.resources]]
key = "host_build"
kind = "capacity"
pool = "aethyme-host-build"
units = 1
limit = 6

[[gate]]
# 2026-07-27: the registry's enforcement previously ran ONLY in the
# GitHub PR workflow — a path broker submissions never take. That hole
# shipped the 12-day `query deps` break (d8bbe85 removed tracked
# symbols; no gate demanded a contract decision). This gate runs the
# same checker on the entry's diff against the integration branch,
# feeding the entry's commit messages as the decision source
# (`Contract decision: <label>` line — checker accepts both this and
# the PR checkbox syntax). No triggers: tracked symbols can be touched
# from any file, and the checker exits fast on clean diffs.
# CHAU7_CTO_OPTIM_ACTIVE=1 bypasses Chau7's CTO git wrapper
# (~/.chau7/cto_bin/git), which compresses `git log`/`git status`
# output for token savings in agent tabs. Discovered 2026-07-28 when
# it truncated commit bodies to subject lines and this gate rejected a
# correctly-labeled entry: any gate that PARSES git output must force
# the real binary or it reads CTO fiction.
# The gate also reads commit bodies, so tree-hash caching is unsound:
# amending only `Contract decision: ...` keeps the tree unchanged.
# 2026-08-01 (python-retirement Phase 6): the checker is native
# (`aethyme broker check-contract`) and is built from the worktree under
# test rather than taken from PATH — a gate that validated a diff using
# a stale installed binary would be checking the wrong code.
# 2026-10-04: reading commit messages alone turned main red. PR #514 put
# its decision in the PR body (the template's convention), passed the PR
# check, and failed here on its merge commit, where no PR body was read.
# The checker now reads the commits itself (`--commit-messages`) and, only
# when they declare nothing that passes, the bodies of the pull requests
# GitHub associates with HEAD (`--merged-pr`, via `gh`; Aethyme Gates
# provides GH_TOKEN). A lookup that cannot run fails with its cause and
# the list of sources read; it never passes by default. In a broker
# session the decision still belongs in a commit message, which needs no
# network.
name = "cross-process-contract"
command = 'gi="${AETHYME_GATE_IDLE_CPUS:-0}"; case "$gi" in *[!0-9]*|"") gi=0 ;; ?????*) gi=16 ;; esac; gt=$gi; [ "$gt" -ge 2 ] || gt=2; [ "$gt" -le 8 ] || gt=8; gj=$((gi / 2)); [ "$gj" -ge 1 ] || gj=1; [ "$gj" -le 4 ] || gj=4; export CHAU7_CTO_OPTIM_ACTIVE=1 CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS="${AETHYME_GATE_BUILD_JOBS:-$gj}" RUST_TEST_THREADS="${AETHYME_GATE_TEST_THREADS:-$gt}" NEXTEST_TEST_THREADS="${AETHYME_GATE_TEST_THREADS:-$gt}" CARGO_PROFILE_DEV_DEBUG=1 CARGO_TARGET_DIR="$AETHYME_GATE_CACHE_DIR" && BASE="$(git merge-base HEAD aethyme/integration 2>/dev/null || git rev-parse HEAD~1)" && cargo run --locked --quiet --manifest-path packages/aethyme/rust/Cargo.toml -p aethyme-cli --bin aethyme -- broker check-contract --base "$BASE" --commit-messages --merged-pr'
cost = 1
cache = false
timeout_seconds = 300
resource_wait_seconds = 900
# This cost-1 gate is still load-sensitive: measured runs above 3 load/CPU
# were much more likely to fail or time out, so opt it into load admission.
# Its 300s deadline scales proportionally to start load/CPU, up to this
# threshold and a global 4x ceiling; timeout logs include start and timeout load.
max_load_per_cpu = 3.0

# Keep contract builds separate from the shared workspace test cache. Each
# remains exclusively leased, but a long test run need not block contract
# checks in another session. The first contract build is cold and uses its
# own bounded cache; fast-guards and cargo-test still share their artifacts.
[gate.managed_cache]
key = "rust-contract-v1"
max_bytes = 12884901888

[[gate.resources]]
key = "host_build"
kind = "capacity"
pool = "aethyme-host-build"
units = 1
limit = 6
