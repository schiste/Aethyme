# Gates for the Aethyme monorepo (dogfood config — issue #33).
#
# Contract notes:
# - Commands run with cwd = the worktree being verified — including the
#   throwaway merge-simulation worktrees — so nothing here may assume the
#   main checkout's cwd. $MAIN resolves the main checkout from any
#   worktree, letting gates reuse its .venv (linked worktrees have none).
#   Caveat: pytest then runs the worktree's code/tests (cwd wins sys.path)
#   with the main venv's dependencies — good enough for v0; log friction
#   if a dependency-changing diff slips through.
# - CARGO_TARGET_DIR is shared so merge-sim worktrees don't cold-build the
#   whole workspace on every submit.
# - Gate outputs must be gitignored or they change the working-tree hash
#   and bust the result cache.

[[gate]]
name = "ruff"
command = 'MAIN="$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")" && cd packages/aethyme && "$MAIN/packages/aethyme/.venv/bin/python" -m ruff check .'
cost = 1
triggers = ["packages/aethyme/**/*.py"]

[[gate]]
name = "pytest-local"
command = 'MAIN="$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")" && cd packages/aethyme && "$MAIN/packages/aethyme/.venv/bin/python" -m pytest -q tests/local'
cost = 2
triggers = [
    "packages/aethyme/src/**",
    "packages/aethyme/tests/**",
    "packages/aethyme/skills/**",
    "packages/aethyme/evals/**",
    "packages/aethyme/pyproject.toml",
]

[[gate]]
# Dogfood catch 2026-07-14: a NEW top-level package matched no trigger, so
# its submit verified with gates:[] and auto-promoted unchecked. Every
# package gets its own gate; when adding a package, add its gate in the
# same change.
name = "pytest-aethyme-eval"
command = 'MAIN="$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")" && PYTHONPATH=packages/aethyme-eval/src "$MAIN/packages/aethyme/.venv/bin/python" -m pytest -q packages/aethyme-eval/tests'
cost = 1
triggers = ["packages/aethyme-eval/**"]

[[gate]]
name = "cargo-test"
command = 'CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-$HOME/.cache/aethyme-cargo-target}" cargo test --workspace --quiet --manifest-path packages/aethyme/rust/Cargo.toml'
cost = 3
triggers = ["**/*.rs", "**/Cargo.toml"]

[[gate]]
# 2026-07-27: the registry's enforcement previously ran ONLY in the
# GitHub PR workflow — a path broker submissions never take. That hole
# shipped the 12-day `query deps` break (d8bbe85 removed tracked
# symbols; no gate demanded a contract decision). This gate runs the
# same checker on the entry's diff against the integration branch,
# feeding the entry's commit messages as the decision source
# (`Contract decision: <label>` line — checker accepts both this and
# the PR checkbox syntax). No triggers: tracked symbols can be touched
# from any file, and the checker exits fast on clean diffs.
# CHAU7_CTO_OPTIM_ACTIVE=1 bypasses Chau7's CTO git wrapper
# (~/.chau7/cto_bin/git), which compresses `git log`/`git status`
# output for token savings in agent tabs. Discovered 2026-07-28 when
# it truncated commit bodies to subject lines and this gate rejected a
# correctly-labeled entry: any gate that PARSES git output must force
# the real binary or it reads CTO fiction.
# The gate also reads commit bodies, so tree-hash caching is unsound:
# amending only `Contract decision: ...` keeps the tree unchanged.
name = "cross-process-contract"
command = 'export CHAU7_CTO_OPTIM_ACTIVE=1 && MAIN="$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")" && BASE="$(git merge-base HEAD aethyme/integration 2>/dev/null || git rev-parse HEAD~1)" && BODY="$(mktemp)" && git log --format=%B "$BASE"..HEAD > "$BODY" && "$MAIN/packages/aethyme/.venv/bin/python" scripts/check-cross-process-contract.py --base "$BASE" --pr-body "$BODY"'
cost = 1
cache = false
