# Default values for repograph
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global settings
global:
  environment: development
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# RepoGraph API deployment
replicaCount: 3

image:
  registry: docker.io
  repository: repograph/api
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 80
  targetPort: 8000
  annotations: {}

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: repograph.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: repograph-tls
      hosts:
        - repograph.example.com

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - repograph
        topologyKey: kubernetes.io/hostname

# Health probes
livenessProbe:
  httpGet:
    path: /health/live
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /health/startup
    port: 8000
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 30

# Environment configuration
env:
  LOG_LEVEL: INFO
  ENABLE_METRICS: "true"
  ENABLE_TRACING: "true"
  WORKER_CONCURRENCY: "4"

# External secrets (using External Secrets Operator)
externalSecrets:
  enabled: true
  refreshInterval: 1h
  secretStore:
    name: aws-secretsmanager
    kind: SecretStore
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: repograph/database-url
    - secretKey: REDIS_URL
      remoteRef:
        key: repograph/redis-url
    - secretKey: JWT_SECRET
      remoteRef:
        key: repograph/jwt-secret
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: repograph/oidc-client-id
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: repograph/oidc-client-secret

# ConfigMap data
config:
  API_VERSION: v1
  RATE_LIMIT_PER_MINUTE: "100"
  CACHE_TTL_SECONDS: "3600"
  MAX_QUERY_DEPTH: "10"

# Worker configuration
worker:
  enabled: true
  replicaCount: 2

  image:
    registry: docker.io
    repository: repograph/worker
    tag: "latest"

  resources:
    limits:
      cpu: 4000m
      memory: 8Gi
    requests:
      cpu: 1000m
      memory: 2Gi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 85

  env:
    WORKER_TYPE: indexer
    WORKER_CONCURRENCY: "8"

# PostgreSQL configuration
postgresql:
  enabled: true
  architecture: replication
  auth:
    username: repograph
    database: repograph
    existingSecret: repograph-postgres-secret
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password

  primary:
    persistence:
      enabled: true
      size: 100Gi
      storageClass: ""

    resources:
      limits:
        cpu: 4000m
        memory: 8Gi
      requests:
        cpu: 1000m
        memory: 4Gi

    podSecurityContext:
      enabled: true
      fsGroup: 1001

    containerSecurityContext:
      enabled: true
      runAsUser: 1001
      runAsNonRoot: true

  readReplicas:
    replicaCount: 2
    persistence:
      enabled: true
      size: 100Gi

    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 2Gi

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# Redis configuration
redis:
  enabled: true
  architecture: replication
  auth:
    enabled: true
    existingSecret: repograph-redis-secret
    existingSecretPasswordKey: password

  master:
    persistence:
      enabled: true
      size: 20Gi

    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 512Mi

  replica:
    replicaCount: 2
    persistence:
      enabled: true
      size: 20Gi

    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 512Mi

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# Monitoring configuration
monitoring:
  enabled: true

  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    labels:
      prometheus: kube-prometheus

  prometheusRule:
    enabled: true
    labels:
      prometheus: kube-prometheus

    rules:
      # High error rate
      - alert: HighErrorRate
        expr: |
          rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} for {{ $labels.instance }}"

      # Slow queries
      - alert: SlowQueries
        expr: |
          histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[15m])) > 5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Slow queries detected"
          description: "95th percentile latency is {{ $value }}s"

      # Pod restarts
      - alert: FrequentPodRestarts
        expr: |
          rate(kube_pod_container_status_restarts_total[10m]) > 0.3
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Frequent pod restarts"
          description: "Pod {{ $labels.pod }} is restarting frequently"

      # Disk space
      - alert: LowDiskSpace
        expr: |
          kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space"
          description: "Volume {{ $labels.persistentvolumeclaim }} has less than 20% space remaining"

      # Memory pressure
      - alert: HighMemoryUsage
        expr: |
          container_memory_usage_bytes / container_spec_memory_limit_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Container {{ $labels.container }} is using {{ $value | humanizePercentage }} of memory limit"

# Network policies
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            name: ingress-nginx
      ports:
      - protocol: TCP
        port: 8000

  egress:
    - to:
      - namespaceSelector: {}
      ports:
      - protocol: TCP
        port: 5432  # PostgreSQL
      - protocol: TCP
        port: 6379  # Redis
    - to:
      - namespaceSelector: {}
      ports:
      - protocol: TCP
        port: 53   # DNS
      - protocol: UDP
        port: 53   # DNS

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Backup configuration
backup:
  enabled: true
  schedule: "0 2 * * *"  # Daily at 2 AM
  retention: 30  # days

  postgres:
    enabled: true
    storageClass: ""
    size: 200Gi

  redis:
    enabled: true
    storageClass: ""
    size: 50Gi
