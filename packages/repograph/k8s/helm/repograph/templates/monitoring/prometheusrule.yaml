{{- if and .Values.monitoring.enabled .Values.monitoring.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "repograph.fullname" . }}
  labels:
    {{- include "repograph.labels" . | nindent 4 }}
    {{- with .Values.monitoring.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
  - name: repograph.availability
    interval: 30s
    rules:
    {{- range .Values.monitoring.prometheusRule.rules }}
    - alert: {{ .alert }}
      expr: {{ .expr | nindent 8 }}
      {{- if .for }}
      for: {{ .for }}
      {{- end }}
      labels:
        {{- toYaml .labels | nindent 8 }}
      annotations:
        {{- toYaml .annotations | nindent 8 }}
    {{- end }}

  - name: repograph.performance
    interval: 30s
    rules:
    - alert: HighRequestLatency
      expr: |
        histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job="repograph"}[5m])) by (le, endpoint)) > 2
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "High request latency"
        description: "99th percentile latency is above 2s for endpoint {{ $labels.endpoint }}"

    - alert: VeryHighRequestLatency
      expr: |
        histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job="repograph"}[5m])) by (le, endpoint)) > 5
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Very high request latency"
        description: "99th percentile latency is above 5s for endpoint {{ $labels.endpoint }}"

    - alert: HighQueryLatency
      expr: |
        histogram_quantile(0.95, sum(rate(query_duration_seconds_bucket{job="repograph"}[15m])) by (le, query_type)) > 2
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "High query latency detected"
        description: "95th percentile query latency is {{ $value }}s for {{ $labels.query_type }}"

  - name: repograph.errors
    interval: 30s
    rules:
    - alert: HighErrorRate
      expr: |
        (sum(rate(http_requests_total{job="repograph",status=~"5.."}[5m])) by (instance) /
        sum(rate(http_requests_total{job="repograph"}[5m])) by (instance)) > 0.05
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: "High HTTP error rate"
        description: "Error rate is {{ $value | humanizePercentage }} on {{ $labels.instance }}"

    - alert: MediumErrorRate
      expr: |
        (sum(rate(http_requests_total{job="repograph",status=~"5.."}[5m])) by (instance) /
        sum(rate(http_requests_total{job="repograph"}[5m])) by (instance)) > 0.01
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "Medium HTTP error rate"
        description: "Error rate is {{ $value | humanizePercentage }} on {{ $labels.instance }}"

    - alert: QueryFailureRate
      expr: |
        rate(query_errors_total{job="repograph"}[5m]) > 0.1
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "High query failure rate"
        description: "Query failures at {{ $value }}/sec on {{ $labels.instance }}"

  - name: repograph.infrastructure
    interval: 30s
    rules:
    - alert: PodCrashLooping
      expr: |
        rate(kube_pod_container_status_restarts_total{namespace="default",pod=~"repograph-.*"}[10m]) > 0.3
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: "Pod is crash looping"
        description: "Pod {{ $labels.pod }} is restarting {{ $value }} times/sec"

    - alert: PodNotReady
      expr: |
        kube_pod_status_ready{namespace="default",pod=~"repograph-.*",condition="true"} == 0
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "Pod not ready"
        description: "Pod {{ $labels.pod }} has been in not-ready state for 15 minutes"

    - alert: DeploymentReplicasMismatch
      expr: |
        kube_deployment_spec_replicas{namespace="default",deployment=~"repograph-.*"} !=
        kube_deployment_status_replicas_available{namespace="default",deployment=~"repograph-.*"}
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "Deployment replicas mismatch"
        description: "Deployment {{ $labels.deployment }} has {{ $value }} available replicas vs desired"

  - name: repograph.resources
    interval: 30s
    rules:
    - alert: HighMemoryUsage
      expr: |
        (container_memory_usage_bytes{namespace="default",pod=~"repograph-.*"} /
        container_spec_memory_limit_bytes{namespace="default",pod=~"repograph-.*"}) > 0.9
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High memory usage"
        description: "Container {{ $labels.container }} in pod {{ $labels.pod }} is using {{ $value | humanizePercentage }} of memory limit"

    - alert: HighCPUUsage
      expr: |
        (rate(container_cpu_usage_seconds_total{namespace="default",pod=~"repograph-.*"}[5m]) /
        container_spec_cpu_quota{namespace="default",pod=~"repograph-.*"} * 100000) > 90
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "High CPU usage"
        description: "Container {{ $labels.container }} in pod {{ $labels.pod }} is using {{ $value }}% of CPU limit"

    - alert: LowDiskSpace
      expr: |
        (kubelet_volume_stats_available_bytes{namespace="default"} /
        kubelet_volume_stats_capacity_bytes{namespace="default"}) < 0.2
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Low disk space"
        description: "Volume {{ $labels.persistentvolumeclaim }} has {{ $value | humanizePercentage }} space remaining"

    - alert: CriticalDiskSpace
      expr: |
        (kubelet_volume_stats_available_bytes{namespace="default"} /
        kubelet_volume_stats_capacity_bytes{namespace="default"}) < 0.1
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Critical disk space"
        description: "Volume {{ $labels.persistentvolumeclaim }} has only {{ $value | humanizePercentage }} space remaining"

  - name: repograph.database
    interval: 30s
    rules:
    - alert: PostgreSQLDown
      expr: |
        pg_up{namespace="default"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "PostgreSQL is down"
        description: "PostgreSQL instance {{ $labels.instance }} is down"

    - alert: PostgreSQLTooManyConnections
      expr: |
        sum(pg_stat_activity_count{namespace="default"}) > 180
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "PostgreSQL has too many connections"
        description: "PostgreSQL has {{ $value }} active connections (limit is 200)"

    - alert: PostgreSQLSlowQueries
      expr: |
        pg_stat_activity_max_tx_duration{namespace="default"} > 300
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "PostgreSQL has slow queries"
        description: "PostgreSQL has queries running for more than 5 minutes"

    - alert: RedisDown
      expr: |
        redis_up{namespace="default"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Redis is down"
        description: "Redis instance {{ $labels.instance }} is down"

    - alert: RedisMemoryHigh
      expr: |
        redis_memory_used_bytes{namespace="default"} / redis_memory_max_bytes{namespace="default"} > 0.9
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Redis memory usage is high"
        description: "Redis is using {{ $value | humanizePercentage }} of max memory"

  - name: repograph.staleness
    interval: 60s
    rules:
    - alert: IndexStaleness
      expr: |
        (time() - index_last_updated_timestamp{job="repograph"}) > 259200
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: "Index is stale"
        description: "Index for {{ $labels.repository }} hasn't been updated in {{ $value | humanizeDuration }}"

    - alert: CriticalIndexStaleness
      expr: |
        (time() - index_last_updated_timestamp{job="repograph"}) > 604800
      for: 1h
      labels:
        severity: critical
      annotations:
        summary: "Index is critically stale"
        description: "Index for {{ $labels.repository }} hasn't been updated in {{ $value | humanizeDuration }}"

  - name: repograph.cost
    interval: 300s
    rules:
    - alert: CostBudgetExceeded
      expr: |
        increase(cost_total_dollars{job="repograph"}[1h]) > 100
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Cost budget exceeded"
        description: "Hourly cost is ${{ $value }}, exceeding budget"

    - alert: HighTokenUsage
      expr: |
        rate(llm_tokens_total{job="repograph"}[5m]) > 100000
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "High token usage rate"
        description: "Token usage rate is {{ $value }}/sec, which may indicate issues"
{{- end }}
