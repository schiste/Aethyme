{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "repograph.fullname" . }}-redis
  labels:
    {{- include "repograph.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache
spec:
  type: ClusterIP
  ports:
  - name: redis
    port: 6379
    targetPort: redis
    protocol: TCP
  selector:
    {{- include "repograph.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: cache
{{- end }}
