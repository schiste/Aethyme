{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "repograph.fullname" . }}-secret
  labels:
    {{- include "repograph.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore.name }}
    kind: {{ .Values.externalSecrets.secretStore.kind }}
  target:
    name: {{ include "repograph.fullname" . }}-secret
    creationPolicy: Owner
  data:
  {{- range .Values.externalSecrets.data }}
  - secretKey: {{ .secretKey }}
    remoteRef:
      key: {{ .remoteRef.key }}
  {{- end }}
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "repograph.fullname" . }}-secret
  labels:
    {{- include "repograph.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: "postgresql://repograph:changeme@postgres:5432/repograph"
  REDIS_URL: "redis://redis:6379/0"
  JWT_SECRET: "changeme"
  OIDC_CLIENT_ID: "changeme"
  OIDC_CLIENT_SECRET: "changeme"
{{- end }}
