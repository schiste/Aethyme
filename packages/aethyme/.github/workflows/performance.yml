name: Performance Benchmarks

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  benchmark:
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aethyme_bench
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:8
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest-benchmark memory_profiler psutil

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aethyme_bench
        run: |
          alembic upgrade head

      - name: Seed test data
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aethyme_bench
          REDIS_URL: redis://localhost:6379/0
        run: |
          python scripts/seed_benchmark_data.py

      - name: Run indexing benchmarks
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aethyme_bench
          REDIS_URL: redis://localhost:6379/0
        run: |
          python benchmarks/indexing_benchmark.py --output indexing_results.json

      - name: Run query benchmarks
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aethyme_bench
          REDIS_URL: redis://localhost:6379/0
        run: |
          python benchmarks/query_benchmark.py --output query_results.json

      - name: Run cache benchmarks
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aethyme_bench
          REDIS_URL: redis://localhost:6379/0
        run: |
          python benchmarks/cache_benchmark.py --output cache_results.json

      - name: Download baseline benchmarks
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: benchmark-baseline
          path: baseline/

      - name: Compare with baseline
        if: github.event_name == 'pull_request'
        run: |
          python benchmarks/compare_benchmarks.py \
            --current-indexing indexing_results.json \
            --current-query query_results.json \
            --current-cache cache_results.json \
            --baseline-indexing baseline/indexing_results.json \
            --baseline-query baseline/query_results.json \
            --baseline-cache baseline/cache_results.json \
            --output comparison.md \
            --threshold 20

      - name: Check performance regression
        if: github.event_name == 'pull_request'
        run: |
          # Fail if any benchmark regressed by more than 20%
          if grep -q "REGRESSION" comparison.md; then
            echo "Performance regression detected!"
            cat comparison.md
            exit 1
          fi

      - name: Post benchmark results to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comparison = fs.readFileSync('comparison.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Performance Benchmark Results\n\n${comparison}`
            });

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: |
            indexing_results.json
            query_results.json
            cache_results.json
            comparison.md

      - name: Save baseline benchmarks
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-baseline
          path: |
            indexing_results.json
            query_results.json
            cache_results.json

  memory-profiling:
    name: Memory Profiling
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aethyme_bench
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install memory_profiler matplotlib

      - name: Run memory profiling
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aethyme_bench
        run: |
          python benchmarks/memory_profile.py --output memory_report.txt

      - name: Upload memory profile
        uses: actions/upload-artifact@v4
        with:
          name: memory-profile-${{ github.sha }}
          path: memory_report.txt

  load-testing:
    name: Load Testing
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install locust

      - name: Start test environment
        run: |
          docker-compose -f docker-compose.bench.yml up -d
          sleep 30

      - name: Run load tests
        run: |
          locust -f benchmarks/locustfile.py --host=http://localhost:8000 \
            --users 100 --spawn-rate 10 --run-time 5m --headless \
            --html load_test_report.html

      - name: Stop test environment
        if: always()
        run: |
          docker-compose -f docker-compose.bench.yml down -v

      - name: Upload load test report
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report-${{ github.sha }}
          path: load_test_report.html

  summary:
    name: Performance Summary
    runs-on: ubuntu-latest
    needs: [benchmark, memory-profiling]
    if: always()

    steps:
      - name: Check performance results
        run: |
          echo "Benchmark: ${{ needs.benchmark.result }}"
          echo "Memory Profiling: ${{ needs.memory-profiling.result }}"

          if [ "${{ needs.benchmark.result }}" != "success" ]; then
            echo "Performance benchmarks failed or regressed"
            exit 1
          fi
          echo "All performance checks passed"
