name: 'Aethyme Scorecard'
description: 'Run Aethyme AI-readiness scorecard and post results to PR'
author: 'Aethyme Team'

branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  api-key:
    description: 'Aethyme API key'
    required: true
  org-id:
    description: 'Organization ID'
    required: true
  repo-path:
    description: 'Repository path (defaults to current directory)'
    required: false
    default: '.'
  apply-fixes:
    description: 'Apply safe autofixes automatically'
    required: false
    default: 'false'
  fail-on-blockers:
    description: 'Fail the check if blockers are found'
    required: false
    default: 'true'
  min-score:
    description: 'Minimum acceptable score (0-100)'
    required: false
    default: '70'
  create-pr:
    description: 'Create pull request with fixes (requires apply-fixes: true)'
    required: false
    default: 'false'
  pr-branch:
    description: 'Branch name for PR with fixes'
    required: false
    default: 'aethyme-autofixes'
  github-token:
    description: 'GitHub token for posting comments (defaults to GITHUB_TOKEN)'
    required: false
    default: ${{ github.token }}
  detectors:
    description: 'Comma-separated list of detectors to run (runs all if not specified)'
    required: false
  format:
    description: 'Output format (json, md, both)'
    required: false
    default: 'both'

outputs:
  score:
    description: 'Overall AI-readiness score (0-100)'
  blockers:
    description: 'Number of blocker violations'
  warnings:
    description: 'Number of warning violations'
  info:
    description: 'Number of info violations'
  report-path:
    description: 'Path to generated report file'

runs:
  using: 'node20'
  main: 'index.js'
