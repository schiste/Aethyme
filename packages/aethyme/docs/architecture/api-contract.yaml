openapi: 3.1.0
info:
  title: Aethyme Core API Contract
  version: 2.0.0
  description: Minimal contract for the active Aethyme Core backend surface. Rust engine components sit behind this contract; Python remains the current delivery layer.
servers:
  - url: http://localhost:8001
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
paths:
  /health/:
    get:
      summary: Basic health check
  /api/v1/index/repositories:
    post:
      summary: Register and index a repository
  /api/v1/index/status/{repo_id}:
    get:
      summary: Fetch repository index status
  /api/v1/index/freshness:
    get:
      summary: Fetch tenant freshness summary
  /api/v1/search/:
    post:
      summary: Search the indexed graph
  /api/v1/search/suggest:
    get:
      summary: Suggest symbols by prefix
  /api/v1/search/advanced:
    post:
      summary: Search with filters
  /api/v1/ego/:
    post:
      summary: Build an ego graph for a symbol
  /api/v1/ego/definition/{symbol}:
    get:
      summary: Fetch one symbol definition
  /api/v1/impact/:
    post:
      summary: Run impact analysis for one symbol
  /api/v1/impact/bulk:
    post:
      summary: Run impact analysis for multiple symbols
  /api/v1/scorecard/scan:
    post:
      summary: Trigger a scorecard scan
  /api/v1/scorecard/results/{scan_id}:
    get:
      summary: Fetch one scorecard result
  /api/v1/scorecard/summary/{repository_id}:
    get:
      summary: Fetch the latest scorecard summary
  /api/v1/scorecard/history/{repository_id}:
    get:
      summary: Fetch scorecard history
  /api/v1/scorecard/checks:
    get:
      summary: List available scorecard checks
