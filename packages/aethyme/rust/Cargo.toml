[workspace]
members = [
    "crates/aethyme-broker",
    "crates/aethyme-cli",
    "crates/aethyme-contracts",
    "crates/aethyme-engine",
    "crates/aethyme-enhance",
    "crates/aethyme-graph-indexer",
    "crates/aethyme-graph-schema",
    "crates/aethyme-graph-storage",
    "crates/aethyme-producers",
    "crates/aethyme-quality",
    "crates/aethyme-testkit",
]
resolver = "2"

[workspace.dependencies]
bincode = "1"
blake3 = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
clap = { version = "4", features = ["derive"] }
data-encoding = "2"
dhat = "0.3"
fastrand = "2"
globset = "0.4"
libc = "0.2"
noyalib = "0.0.53"
oxc_allocator = "=0.125"
oxc_ast = "=0.125"
oxc_ast_visit = "=0.125"
oxc_syntax = "=0.125"
oxc_parser = "=0.125"
oxc_span = "=0.125"
ra_ap_syntax = "=0.0.331"
rayon = "1.10"
redb = "4"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
ruff_python_ast = { package = "rustpython-ruff_python_ast", version = "0.15" }
ruff_python_parser = { package = "rustpython-ruff_python_parser", version = "0.15" }
ruff_text_size = { package = "rustpython-ruff_text_size", version = "0.15" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
similar = "3"
tempfile = "3"
thiserror = "2"
toml = "0.8"
toml_edit = "0.22"
tree-sitter = "0.25"
tree-sitter-php = "=0.23.11"
walkdir = "2"

[workspace.package]
version = "0.8.26"

# Workspace lint floor. Every crate opts in with `[lints] workspace = true`.
#
# This is a ratchet, not a cleanup: it sets the floor to what the tree satisfies
# today so the next change cannot regress below it. It is deliberately narrow.
# `unwrap_used` and friends are NOT enabled — the tree has ~1,300 `unwrap` calls,
# so that would be a mass rewrite rather than a guard rail, and whether an unwrap
# is correct belongs to the crate that owns the call, not to a global default.
[workspace.lints.clippy]
# Debugging leftovers must not reach a release.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# `undocumented_unsafe_blocks` and `redundant_clone` are the ratchet proper. The
# whole tree satisfies `undocumented_unsafe_blocks` today only because this change
# adds the missing SAFETY comments (graph-storage `flock`, quality `localtime_r`,
# engine `kill`/`pre_exec`) and turns it on; the broker and engine test fixtures
# that cannot satisfy it carry a scoped `#[allow]` in place, each with the reason
# inline. `redundant_clone` is left off globally because the permutation tests
# in aethyme-graph-storage clone on purpose and because ~40 remaining clones live
# in aethyme-broker; it is enabled per-file where it applies and is a follow-up.
#
# Turning `undocumented_unsafe_blocks` on here is the highest-value line in the
# manifest: the tree has ~45 `unsafe` blocks and this makes an undocumented one a
# build failure rather than something a reviewer has to catch.
undocumented_unsafe_blocks = "deny"
