# cargo-deny policy for the Aethyme workspace (recovery plan P1.5).
# Run from packages/aethyme/rust: `cargo deny check`. CI runs it on every PR.

[graph]
all-features = false

[advisories]
# Vulnerabilities and unsound crates fail the check. Unmaintained crates are
# reported; the ignores below each name the follow-up that replaces them.
ignore = [
    # bincode 1.x is unmaintained. It (de)serializes the graph store and schema
    # (aethyme-engine, aethyme-graph-storage, aethyme-graph-schema); replacing it
    # changes the on-disk format, so it is tracked for the graph rework (#213)
    # rather than swapped in place.
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained; replacement changes the graph on-disk format, tracked with #213" },
]

[licenses]
# Every license currently in the dependency tree. A new one needs a deliberate
# addition here, not a silent pass.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
# The only version-less dependencies are the workspace's own path crates,
# which are never published to crates.io (installs use `cargo install --path`
# and the release tarballs).
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
