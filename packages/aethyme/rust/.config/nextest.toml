# cargo-nextest configuration for the packages/aethyme/rust workspace.
#
# nextest runs each test in its own process and schedules tests across all
# test binaries. It does not run doctests or example targets; CI runs those
# with cargo test --doc and cargo test --examples separately.

[profile.default]
# Preserve nextest's standard behavior for direct invocations.

[profile.local]
# Ordinary local runs keep compile and test concurrency bounded.
test-threads = 2
retries = 0
fail-fast = true
# Keep passing output quiet while retaining each failure in the final report.
failure-output = "final"
success-output = "never"
status-level = "fail"
# Bound each test process so a hang cannot hold the local gate indefinitely.
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
# Report every failure in one run instead of stopping at the first.
fail-fast = false
# Retry a failing test once. A test that passes on retry is reported as
# FLAKY rather than hidden, and a test that fails twice still fails the run.
# This targets known timing-sensitive tests such as the one in #419.
retries = 1
# Print failure output where it happened and again in the final summary.
failure-output = "immediate-final"
# Flag a test after each minute and kill it after five, so a hanging test
# fails the run with its name instead of holding the job until GitHub's
# timeout (the first run of this profile sat in one step for over an hour).
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci.junit]
path = "junit.xml"
