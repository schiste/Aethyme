# cargo-nextest configuration for the packages/aethyme/rust workspace.
#
# nextest runs every test in its own process, so tests cannot share
# in-process state; it also schedules tests across all test binaries at
# once, which is where most of its speed over `cargo test` comes from.
# It does not run doctests or example targets: CI runs those with
# `cargo test --doc` and `cargo test --examples` separately.

[profile.default]
# Local runs keep nextest's defaults.

[profile.ci]
# Report every failure in one run instead of stopping at the first.
fail-fast = false
# Retry a failing test once. A test that passes on retry is reported as
# FLAKY rather than hidden, and a test that fails twice still fails the run.
# This targets known timing-sensitive tests such as the one in #419.
retries = 1
# Print failure output where it happened and again in the final summary.
failure-output = "immediate-final"
# Flag a test after each minute and kill it after five, so a hanging test
# fails the run with its name instead of holding the job until GitHub's
# timeout (the first run of this profile sat in one step for over an hour).
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci.junit]
# packages/aethyme/scripts/test-like-ci.sh reads per-test durations from this
# report to print the slowest tests after every run, local or CI (#598).
path = "junit.xml"
