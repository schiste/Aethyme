[package]
name = "aethyme-broker-cli"
version.workspace = true
edition = "2024"
description = "The broker's command-line and operator layer: the `aethyme broker` command tree, storage reports, local exchange, handoff and restore, diagnostic reports, and the services the CLI installs. Built on aethyme-broker's core."
license = "Apache-2.0"
# Integration tests are listed below; see tests/it.rs.
autotests = false

[lib]
name = "aethyme_broker_cli"
path = "src/lib.rs"

[[bin]]
# Worker binary used exclusively by the multi-process stress test
# (tests/stress.rs). Not a user-facing entrypoint.
name = "broker-stress-worker"
path = "src/bin/broker-stress-worker.rs"

[[bin]]
# Router stand-in used exclusively by the hook end-to-end tests
# (tests/hooks_e2e.rs). Not a user-facing entrypoint.
name = "broker-cli-shim"
path = "src/bin/broker-cli-shim.rs"

[dependencies]
aethyme-broker = { path = "../aethyme-broker" }
# Experimental v0 contracts: the AQ0 analysis envelope (#655).
aethyme-config = { path = "../aethyme-config" }
aethyme-contracts = { path = "../aethyme-contracts" }
aethyme-engine = { path = "../aethyme-engine" }
aethyme-enhance = { path = "../aethyme-enhance" }
aethyme-graph-indexer = { path = "../aethyme-graph-indexer" }
aethyme-graph-schema = { path = "../aethyme-graph-schema" }
aethyme-graph-storage = { path = "../aethyme-graph-storage" }
# Bundled SQLite so the broker has zero system dependencies and one
# known SQLite version across platforms (macOS/Linux are the v0 targets).
rusqlite = { workspace = true }
thiserror = { workspace = true }
# The --json CLI contract (#32): output shapes come from the library's
# serializable types, so Serialize lives on the types themselves.
serde = { workspace = true }
serde_json = { workspace = true }
# Repository issue forms are YAML 1.2. Noyalib is a pure-Rust, safe-code
# parser with native Serde support; the renderer only uses typed decoding.
noyalib = { workspace = true }
# .aethyme/config.toml ([leases] ignore, later [gates]/[promote]).
toml = { workspace = true }
# Gate trigger globs (gates.toml). Same matcher family ripgrep uses.
globset = { workspace = true }
notify = { workspace = true }
# Folding paths the way case- and normalization-insensitive file systems
# do, so a protected path cannot be written under another spelling (#665).
unicode-normalization = { workspace = true }
# killpg for gate-run cancellation (the external `kill` utility parses
# negative pgids as options on Linux).
libc = { workspace = true }
# Offline report digests are the review/filing confirmation contract.
sha2 = { workspace = true }
# The composer's text profile detects moved blocks with a line diff (#664).
similar = { workspace = true }
# Archived blobs are checked against their Git object id while they are
# copied; SHA-1 repositories need SHA-1 for that (#657).
sha1 = { workspace = true }
# Atomic report publication uses a sibling tempfile plus persist_noclobber.
tempfile = { workspace = true }
# Inspect candidate output tar entries without unpacking untrusted paths.
tar = { workspace = true }
# Release availability and downgrade decisions use semantic versions rather
# than string ordering.
semver = { workspace = true }

# `tests/gate_policy.rs` asserts over the live `.aethyme/gates.toml`, so it
# needs the monorepo root rather than this crate's. `repo_root()` discovers
# it from the process cwd, which stays correct when a gate reuses a test
# binary compiled in a different merge worktree.
[dev-dependencies]
# Independent boundary oracle for the literal contract scanner.
regex = { workspace = true }
aethyme-testkit = { path = "../aethyme-testkit" }
# Seeds tempfile's generator in a test to reproduce the #430 name collision.
fastrand = { workspace = true }

# This crate does not yet satisfy the workspace's `undocumented_unsafe_blocks`
# or `redundant_clone` ratchet: 21 `unsafe` blocks (mostly the `flock`,
# `sigset_t` and `kill` paths in `operations.rs`, `resources.rs`, `ship.rs` and
# `console.rs`) and 44 redundant clones remain. Documenting those blocks and
# removing the clones is a separate change; until it lands, the two lints stay
# off here rather than being suppressed inline at ~65 sites, so the debt stays
# visible in one place.
[lints]
workspace = true

# One binary for most integration suites; see tests/it.rs.
[[test]]
name = "it"
path = "tests/it.rs"

# Separate binaries: each re-runs its own binary with `--exact <test name>`
# to get a child process with a poisoned environment. Inside `it` the test
# name gains a module prefix, so `--exact` would match nothing.
[[test]]
name = "broker"
path = "tests/broker.rs"

[[test]]
name = "collaboration_state_cleanup"
path = "tests/collaboration_state_cleanup.rs"

[[test]]
name = "fixture_host_state_isolation_cli"
path = "tests/fixture_host_state_isolation_cli.rs"

[[test]]
name = "fixture_isolation"
path = "tests/fixture_isolation.rs"

[[test]]
name = "gate_database_isolation"
path = "tests/gate_database_isolation.rs"

[[test]]
name = "gc"
path = "tests/gc.rs"

[[test]]
name = "integration_drift"
path = "tests/integration_drift.rs"

[[test]]
name = "operations_e2e"
path = "tests/operations_e2e.rs"

[[test]]
name = "pr_overlap_cli"
path = "tests/pr_overlap_cli.rs"

[[test]]
name = "promote_mode"
path = "tests/promote_mode.rs"

[[test]]
name = "service_jobs"
path = "tests/service_jobs.rs"

# Separate binaries: each changes process-wide environment variables
# (`set_var`/`remove_var`), which would race the other suites when
# `cargo test` runs `it` in one process.
[[test]]
name = "candidate_boundary_grandfather"
path = "tests/candidate_boundary_grandfather.rs"

[[test]]
name = "candidate_boundary_trust"
path = "tests/candidate_boundary_trust.rs"

[[test]]
name = "gates_e2e"
path = "tests/gates_e2e.rs"

# Separate binaries: a gate in `.aethyme/gates.toml` or a release workflow
# selects each by name (`--test <suite>`) and builds only that suite.
[[test]]
name = "gate_policy"
path = "tests/gate_policy.rs"

[[test]]
name = "host_operations_e2e"
path = "tests/host_operations_e2e.rs"
