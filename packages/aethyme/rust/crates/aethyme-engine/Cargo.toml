[package]
name = "aethyme-engine"
version = "0.1.1"
edition = "2024"
description = "Deterministic engine components for Aethyme Core"
license = "Apache-2.0"

[lib]
name = "aethyme_engine"
path = "src/lib.rs"

[[bin]]
name = "aethyme-engine-cli"
path = "src/bin/aethyme-engine-cli.rs"

[[bin]]
name = "aethyme"
path = "src/bin/aethyme.rs"

[dependencies]
# Broker CLI dispatch: the `aethyme` router binary exposes `aethyme broker ...`
# by calling aethyme_broker::cli (bin-only usage; engine library code must not
# depend on broker state).
aethyme-broker = { path = "../aethyme-broker" }
# Enhance dispatch (python-retirement Phase 2): bin-only usage by the
# `aethyme` router (`enhance deploy|verify` behind AETHYME_ENHANCE_NATIVE=1).
# Cargo has no per-bin dependencies, so this is a normal dependency; the
# planned aethyme-cli crate move (Phase 1 target architecture) relocates
# it out of the engine.
aethyme-enhance = { path = "../aethyme-enhance" }
rayon = "1.10"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
redb = "4"
regex = "1"
libc = "0.2"
dhat = { version = "0.3", optional = true }
aethyme-graph-storage = { path = "../aethyme-graph-storage" }
aethyme-graph-schema = { path = "../aethyme-graph-schema" }
aethyme-producers = { path = "../aethyme-producers" }

[dev-dependencies]
aethyme-graph-indexer = { path = "../aethyme-graph-indexer" }
tempfile = "3"

[features]
dhat-heap = ["dep:dhat"]
