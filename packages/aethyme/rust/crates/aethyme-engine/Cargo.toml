[package]
name = "aethyme-engine"
version = "0.1.0"
edition = "2024"
description = "Deterministic engine components for Aethyme Core"
license = "UNLICENSED"

[lib]
name = "aethyme_engine"
path = "src/lib.rs"

[dependencies]
rayon = "1.10"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
tree-sitter = { version = "0.25", features = ["wasm"] }
once_cell = "1"
redb = "2"
dhat = { version = "0.3", optional = true }

[features]
dhat-heap = ["dep:dhat"]
