[package]
name = "aethyme-engine"
version.workspace = true
edition = "2024"
description = "Deterministic engine components for Aethyme Core"
license = "Apache-2.0"

[lib]
name = "aethyme_engine"
path = "src/lib.rs"

[[bin]]
name = "aethyme-engine-cli"
path = "src/bin/aethyme-engine-cli.rs"

[dependencies]
rayon = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
redb = { workspace = true }
regex = { workspace = true }
libc = { workspace = true }
dhat = { workspace = true, optional = true }
aethyme-graph-storage = { path = "../aethyme-graph-storage" }
aethyme-graph-schema = { path = "../aethyme-graph-schema" }
aethyme-producers = { path = "../aethyme-producers" }
# Definition extraction for the graph-free Explore symbol index (Ruff, Oxc,
# ra_ap_syntax, tree-sitter-php): the same parsers the graph indexer uses.
aethyme-graph-indexer = { path = "../aethyme-graph-indexer" }

[dev-dependencies]
aethyme-testkit = { path = "../aethyme-testkit" }
tempfile = { workspace = true }

[features]
dhat-heap = ["dep:dhat"]

[lints]
workspace = true
