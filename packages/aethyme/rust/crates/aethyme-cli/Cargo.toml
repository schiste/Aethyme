[package]
name = "aethyme-cli"
version.workspace = true
license = "Apache-2.0"
edition = "2024"
description = "The aethyme router binary — single entrypoint for agents. Owns the app shell (native dispatch to engine/broker/enhance, Python delegation for unflipped groups); moved out of aethyme-engine (retirement plan Phase 1 item 1) so the engine lib no longer carries broker/enhance deps for the bin's sake."
# Integration tests are listed below; see tests/it.rs.
autotests = false

[[bin]]
name = "aethyme"
path = "src/main.rs"

[dependencies]
aethyme-engine = { path = "../aethyme-engine" }
aethyme-enhance = { path = "../aethyme-enhance" }
aethyme-graph-indexer = { path = "../aethyme-graph-indexer" }
aethyme-graph-storage = { path = "../aethyme-graph-storage" }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
toml_edit = { workspace = true }

# The implementation-blind CLI suites under `tests/` drive the built
# `aethyme` binary as a subprocess and never link the product crates, so
# the harness plus JSON/tempdir helpers are all they need.
[target.'cfg(unix)'.dependencies]
aethyme-broker = { path = "../aethyme-broker" }
aethyme-quality = { path = "../aethyme-quality" }

[dev-dependencies]
criterion = { workspace = true }
aethyme-testkit = { path = "../aethyme-testkit" }
serde_json = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "product_latency"
harness = false

# One binary for most integration suites; see tests/it.rs.
[[test]]
name = "it"
path = "tests/it.rs"

# Separate binaries: a gate in `.aethyme/gates.toml` or a release workflow
# selects each by name (`--test <suite>`) and builds only that suite.
[[test]]
name = "help_everywhere"
path = "tests/help_everywhere.rs"

[[test]]
name = "help_snapshots"
path = "tests/help_snapshots.rs"

[[test]]
name = "help_surface"
path = "tests/help_surface.rs"

[[test]]
name = "repository_deploy_cli"
path = "tests/repository_deploy_cli.rs"
