[package]
name = "aethyme-cli"
version = "0.1.2"
edition = "2024"
description = "The aethyme router binary — single entrypoint for agents. Owns the app shell (native dispatch to engine/broker/enhance, Python delegation for unflipped groups); moved out of aethyme-engine (retirement plan Phase 1 item 1) so the engine lib no longer carries broker/enhance deps for the bin's sake."

[[bin]]
name = "aethyme"
path = "src/main.rs"

[dependencies]
aethyme-engine = { path = "../aethyme-engine" }
aethyme-broker = { path = "../aethyme-broker" }
aethyme-enhance = { path = "../aethyme-enhance" }
aethyme-quality = { path = "../aethyme-quality" }
libc = "0.2"

# The implementation-blind CLI suites under `tests/` drive the built
# `aethyme` binary as a subprocess and never link the product crates, so
# the harness plus JSON/tempdir helpers are all they need.
[dev-dependencies]
aethyme-testkit = { path = "../aethyme-testkit" }
serde_json = "1"
tempfile = "3"
