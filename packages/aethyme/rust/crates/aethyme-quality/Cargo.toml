[package]
name = "aethyme-quality"
version.workspace = true
license = "Apache-2.0"
edition = "2024"
description = "Optional repository-quality analysis (quality inspect), plus the frozen legacy ai-ready scorecard and autofix fixers ported from the retired Python implementation."

[dependencies]
# localtime_r: the autofix branch name is `datetime.now().strftime(...)`
# in LOCAL time, which std cannot render.
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Unified diffs for autofix patches; text-only, no transitive deps.
similar = "3"
