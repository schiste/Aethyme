[package]
name = "aethyme-graph-indexer"
version = "0.1.1"
edition = "2024"
description = "Indexers that walk source repos and produce aethyme-graph-schema nodes + edges. Phase 3 of the graph rewrite: turns real source files into typed graph payloads suitable for committed per-file fragments."
license = "Apache-2.0"

[lib]
name = "aethyme_graph_indexer"
path = "src/lib.rs"

# The `aethyme-graph-index` CLI binary (Phase 4.1). Wraps the
# library's index_repo_to_disk in a clap-driven command-line
# interface so the indexer can be invoked from shells, CI, eval
# harnesses, and the existing Aethyme engine. Separate binary
# (rather than a subcommand of aethyme-engine-cli) so the
# indexer's deps don't bloat the engine until the engine starts
# actually querying the new fragments (later in Phase 4).
[[bin]]
name = "aethyme-graph-index"
path = "src/bin/aethyme-graph-index.rs"

# `aethyme-graph-query` (Phase 4.3) — read-side CLI exercising
# the FragmentStore API. Sibling to aethyme-graph-index: index
# writes, query reads. Same crate because the indexer + query
# layer share types and dependencies; future engine integration
# will exercise the same FragmentStore via a different surface.
[[bin]]
name = "aethyme-graph-query"
path = "src/bin/aethyme-graph-query.rs"

# `aethyme-graph-link` (Phase 4.5) — standalone linker pass.
# `aethyme-graph-index` already runs the linker by default at
# the end of indexing, but having a dedicated CLI lets the link
# step be re-run after a linker-logic update without re-indexing.
[[bin]]
name = "aethyme-graph-link"
path = "src/bin/aethyme-graph-link.rs"

[dependencies]
# Types this indexer produces (the schema crate is the contract).
aethyme-graph-schema = { path = "../aethyme-graph-schema" }
# Storage crate for Fragment construction + SymbolRecord build-up.
# The indexer doesn't itself write to disk in Phase 3 — that's the
# caller's choice — but it produces Fragments and SymbolRecords
# typed against this crate's contract.
aethyme-graph-storage = { path = "../aethyme-graph-storage" }
# BLAKE3 for computing content_hash on File nodes. Matches the
# choice in aethyme-graph-schema for NodeId hashing.
blake3 = "1"
# walkdir is the standard way to walk a directory tree in Rust.
# We use it for the filesystem-only indexer that produces File /
# NonCodeFile nodes from the repo's source tree.
walkdir = "2"

# Python parsing (Phase 3.3). The Astral/Ruff team's parser, via
# the RustPython project's published fork. Picked over
# tree-sitter-python because:
# (1) ~2-3× faster on cold parses (the perf we picked it for),
# (2) zero C dependencies (keeps the indexer crate pure-Rust),
# (3) the maturity signal of Ruff lint shipping the same parser
#     in production at very high throughput.
#
# Note on the fork: Astral doesn't publish ruff_python_parser
# directly to crates.io (they treat their parser crates as
# in-tree implementation details). The RustPython team
# republishes the same code under the `rustpython-` prefix
# specifically so external consumers can depend on it. The 0.15.x
# series tracks Ruff 0.15.x. PythonIndexer wraps this API so a
# future version bump (or fork swap) lands in one file rather
# than throughout the indexer.
ruff_python_parser = { package = "rustpython-ruff_python_parser", version = "0.15" }
ruff_python_ast = { package = "rustpython-ruff_python_ast", version = "0.15" }
ruff_text_size = { package = "rustpython-ruff_text_size", version = "0.15" }

# rayon (Phase 3.4): data-parallelism for the file-level loop.
# The per-file work (read content + parse + build fragment + write
# fragment) is embarrassingly parallel — each file's output goes
# to a distinct path. On 8-core machines the wall-clock win on
# MediaWiki-scale indexing is roughly 4-8× the single-threaded
# baseline, which dominates parser-choice gains.
rayon = "1"

# TypeScript / JavaScript parsing (Phase 3.5). The Oxc project's
# parser. Pure Rust, MIT-licensed, faster than SWC by 2-3× and
# than tree-sitter-typescript by ~6-10×. The companion crates
# carry the AST types (oxc_ast), arena allocator (oxc_allocator),
# and source-type metadata (oxc_span).
# Pinned to 0.125 — the highest oxc release compatible with
# rustc 1.92 (which is our workspace toolchain). 0.126+ requires
# rustc 1.93. Bumping past 0.125 is a follow-up after a workspace
# rustc bump.
oxc_parser = "=0.125"
oxc_ast = "=0.125"
oxc_allocator = "=0.125"
oxc_span = "=0.125"

# Rust parsing (Phase 3.6) via rust-analyzer's syntax crate.
# ra_ap_syntax provides IDE-grade Rust parsing — the same engine
# that powers rust-analyzer's "go to definition" and refactor
# tools. Pure Rust, MIT/Apache-2.0, optimized for both cold and
# incremental parses. Picked over `syn` because syn is built for
# proc-macro parsing of small token streams; ra_ap_syntax is built
# for full source files at IDE responsiveness.
# Pinned to 0.0.331 — 0.0.332 requires rustc 1.95 (our workspace
# is 1.92). Bumping is a follow-up after a workspace rustc bump.
ra_ap_syntax = "=0.0.331"

# PHP parsing (Phase 3.7) via tree-sitter. This is the ONE
# documented C-dependency exception in the indexer crate. The
# pure-Rust PHP parser ecosystem (`php-parser-rs`) is too thin
# to ship against MediaWiki-scale workloads; tree-sitter-php is
# the production-tested choice. Future work may swap in a
# hand-rolled minimal PHP extractor for top-level declarations
# (per the design conversation), at which point this dep drops.
#
# Pinned to tree-sitter 0.25 to match aethyme-engine's pin
# (tree-sitter uses `links = "tree-sitter"`, which Cargo
# enforces as one-version-per-build-graph). tree-sitter-php
# 0.23.11 is compatible with tree-sitter 0.25.
tree-sitter = "0.25"
tree-sitter-php = "=0.23.11"

# clap for the aethyme-graph-index CLI (Phase 4.1). v4 with
# derive macros — keeps the subcommand-and-arg surface declarative
# and the binary's source readable.
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
# serde_json is used by tests to inspect the JSON shape of produced
# Node values (e.g., to assert visibility="private" without exposing
# accessors on every per-kind struct just for testing).
serde_json = "1"
