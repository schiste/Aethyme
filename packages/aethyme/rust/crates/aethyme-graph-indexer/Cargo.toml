[package]
name = "aethyme-graph-indexer"
version = "0.1.0"
edition = "2024"
description = "Indexers that walk source repos and produce aethyme-graph-schema nodes + edges. Phase 3 of the graph rewrite: turns real source files into typed graph payloads suitable for committed per-file fragments."
license = "UNLICENSED"

[lib]
name = "aethyme_graph_indexer"
path = "src/lib.rs"

[dependencies]
# Types this indexer produces (the schema crate is the contract).
aethyme-graph-schema = { path = "../aethyme-graph-schema" }
# Storage crate for Fragment construction + SymbolRecord build-up.
# The indexer doesn't itself write to disk in Phase 3 — that's the
# caller's choice — but it produces Fragments and SymbolRecords
# typed against this crate's contract.
aethyme-graph-storage = { path = "../aethyme-graph-storage" }
# BLAKE3 for computing content_hash on File nodes. Matches the
# choice in aethyme-graph-schema for NodeId hashing.
blake3 = "1"
# walkdir is the standard way to walk a directory tree in Rust.
# We use it for the filesystem-only indexer that produces File /
# NonCodeFile nodes from the repo's source tree.
walkdir = "2"

# Python parsing (Phase 3.3). The Astral/Ruff team's parser, via
# the RustPython project's published fork. Picked over
# tree-sitter-python because:
# (1) ~2-3× faster on cold parses (the perf we picked it for),
# (2) zero C dependencies (keeps the indexer crate pure-Rust),
# (3) the maturity signal of Ruff lint shipping the same parser
#     in production at very high throughput.
#
# Note on the fork: Astral doesn't publish ruff_python_parser
# directly to crates.io (they treat their parser crates as
# in-tree implementation details). The RustPython team
# republishes the same code under the `rustpython-` prefix
# specifically so external consumers can depend on it. The 0.15.x
# series tracks Ruff 0.15.x. PythonIndexer wraps this API so a
# future version bump (or fork swap) lands in one file rather
# than throughout the indexer.
ruff_python_parser = { package = "rustpython-ruff_python_parser", version = "0.15" }
ruff_python_ast = { package = "rustpython-ruff_python_ast", version = "0.15" }
ruff_text_size = { package = "rustpython-ruff_text_size", version = "0.15" }

# rayon (Phase 3.4): data-parallelism for the file-level loop.
# The per-file work (read content + parse + build fragment + write
# fragment) is embarrassingly parallel — each file's output goes
# to a distinct path. On 8-core machines the wall-clock win on
# MediaWiki-scale indexing is roughly 4-8× the single-threaded
# baseline, which dominates parser-choice gains.
rayon = "1"

[dev-dependencies]
tempfile = "3"
# serde_json is used by tests to inspect the JSON shape of produced
# Node values (e.g., to assert visibility="private" without exposing
# accessors on every per-kind struct just for testing).
serde_json = "1"
