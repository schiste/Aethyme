[package]
name = "aethyme-config"
version.workspace = true
edition = "2024"
description = "One loader for human-authored .aethyme configuration files: resolves <stem>.toml, <stem>.yaml or <stem>.yml (exactly one), converts a strict YAML 1.2 subset into the same toml::Value the subsystems consume, and keeps key-path locations for file:line:col diagnostics."
license = "Apache-2.0"

[lib]
name = "aethyme_config"
path = "src/lib.rs"

[dependencies]
# Repository issue forms already parse YAML 1.2 with noyalib (aethyme-broker),
# so config reuses it rather than adding a second YAML stack: pure Rust, no
# unsafe, YAML 1.2 core schema by default, duplicate-key errors, alias
# expansion budgets, and a lossless CST that exposes key and value spans.
noyalib = { workspace = true }
serde = { workspace = true }
# Every subsystem already consumes `toml::Value`; YAML converts into it.
toml = { workspace = true }
# Span-preserving TOML parse, so TOML diagnostics carry the same
# file:line:col (key.path) form as YAML ones.
toml_edit = { workspace = true }

[lints]
workspace = true
