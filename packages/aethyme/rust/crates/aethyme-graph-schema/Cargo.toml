[package]
name = "aethyme-graph-schema"
version = "0.1.0"
edition = "2024"
description = "Schema types for the Aethyme code graph: node kinds, edge kinds, IDs, serialization. Pure types — no I/O, no storage, no parsing. Implements the design locked in docs/architecture/graph-schema.md."
license = "UNLICENSED"

[lib]
name = "aethyme_graph_schema"
path = "src/lib.rs"

[dependencies]
# Serde is the universal serialization surface. Both binary fragments (bincode,
# arriving in commit 1.12) and NDJSON index shards (serde_json, also 1.12)
# route through the same Serialize/Deserialize derive — keeping one schema
# vocabulary across both transports is the whole point of having this crate.
serde = { version = "1", features = ["derive"] }

# BLAKE3 powers the content-hash node IDs (commit 1.4). The schema doc locks
# this choice for two reasons: (1) ~10x faster than SHA-256 on indexer
# workloads, which matters at MediaWiki scale (~12K files × hashes per
# symbol), and (2) the streaming API is simpler than sha2's reset/update/
# finalize, reducing the surface for non-determinism bugs in the hashing path.
blake3 = "1"

# data-encoding handles the base32 step of the NodeId format (commit 1.4).
# We use BASE32_NOPAD, which is RFC 4648 standard base32 (A–Z plus 2–7,
# no padding), and lowercase the output. The schema doc originally
# specified Crockford base32 to avoid ambiguous characters (0/O, 1/I/l);
# we switched to RFC 4648 because (a) `data-encoding` ships it without
# a custom alphabet table, (b) the ambiguous-char benefit is moot once
# we case-normalize and display IDs in monospace, and (c) RFC 4648 is
# more universally understood. See identity.rs's module docs for the
# full rationale.
data-encoding = "2"

[dev-dependencies]
# serde_json is used only by the integration tests to assert round-trip
# behavior of the NodeKind / EdgeKind serde derives. It is NOT a runtime
# dep of this crate: production fragments are bincode (binary), and
# index shards are NDJSON (produced via serde_json from the consumer
# crate, not here). Keeping serde_json out of the main `[dependencies]`
# keeps the leaf-crate property — consumers that don't need JSON don't
# pull it in.
serde_json = "1"

# bincode is used by tests/determinism.rs to assert byte-determinism
# of the binary fragment format. Matches the engine crate's bincode 1
# choice. Same dev-only rationale as serde_json — production binary
# fragment writing lives in the storage layer (Phase 2+), this crate
# only tests that its types round-trip through bincode losslessly.
bincode = "1"
