[package]
name = "aethyme-enhance"
version.workspace = true
license = "Apache-2.0"
edition = "2021"
description = "Deployment and templating for Aethyme discoverability: enhance deploy/verify, skill compilation, AGENTS.md rendering with overrides. Retirement-plan Phase 2 port of src/enhance.py + indexing/skills.py; outputs are byte-deterministic, held by `enhance verify` canonical-match checks and tests/local/test_enhance.py."

[dependencies]
# Shared .aethyme config loader: <stem>.toml, .yaml or .yml (#1223).
aethyme-config = { path = "../aethyme-config" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[lints]
workspace = true
