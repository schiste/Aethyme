# Production environment overrides
global:
  environment: production

replicaCount: 5

image:
  tag: "v1.0.0"
  pullPolicy: Always

ingress:
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "200"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/enable-cors: "true"
  hosts:
    - host: api.aethyme.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: aethyme-production-tls
      hosts:
        - api.aethyme.com

resources:
  limits:
    cpu: 4000m
    memory: 8Gi
  requests:
    cpu: 1000m
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 5
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

env:
  LOG_LEVEL: INFO
  ENABLE_METRICS: "true"
  ENABLE_TRACING: "true"
  WORKER_CONCURRENCY: "8"

worker:
  replicaCount: 3
  resources:
    limits:
      cpu: 8000m
      memory: 16Gi
    requests:
      cpu: 2000m
      memory: 4Gi
  autoscaling:
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75

postgresql:
  primary:
    persistence:
      size: 500Gi
    resources:
      limits:
        cpu: 8000m
        memory: 16Gi
      requests:
        cpu: 2000m
        memory: 8Gi

  readReplicas:
    replicaCount: 3
    persistence:
      size: 500Gi
    resources:
      limits:
        cpu: 4000m
        memory: 8Gi
      requests:
        cpu: 1000m
        memory: 4Gi

redis:
  master:
    persistence:
      size: 50Gi
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 1Gi

  replica:
    replicaCount: 3
    persistence:
      size: 50Gi

podDisruptionBudget:
  enabled: true
  minAvailable: 3

backup:
  enabled: true
  schedule: "0 1 * * *"  # Daily at 1 AM
  retention: 30  # days

  postgres:
    enabled: true
    size: 1Ti

  redis:
    enabled: true
    size: 100Gi
