# Staging environment overrides
global:
  environment: staging

replicaCount: 2

image:
  tag: "staging"

ingress:
  hosts:
    - host: staging.aethyme.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: aethyme-staging-tls
      hosts:
        - staging.aethyme.example.com

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

env:
  LOG_LEVEL: DEBUG
  ENABLE_METRICS: "true"
  ENABLE_TRACING: "true"

worker:
  replicaCount: 1
  autoscaling:
    minReplicas: 1
    maxReplicas: 5

postgresql:
  primary:
    persistence:
      size: 50Gi
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 2Gi

  readReplicas:
    replicaCount: 1

redis:
  master:
    persistence:
      size: 10Gi
  replica:
    replicaCount: 1

backup:
  schedule: "0 3 * * *"  # Daily at 3 AM
  retention: 14  # days
