apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aethyme.fullname" . }}-config
  labels:
    {{- include "aethyme.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  ENVIRONMENT: {{ .Values.global.environment | quote }}
