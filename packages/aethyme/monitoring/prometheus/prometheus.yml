global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'aethyme-dev'
    environment: 'development'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "alerts.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Aethyme API metrics
  - job_name: 'aethyme-api'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8000']
        labels:
          service: 'api'
          component: 'backend'

  # Aethyme Worker metrics
  - job_name: 'aethyme-worker'
    scrape_interval: 15s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['worker:8001']
        labels:
          service: 'worker'
          component: 'background'

  # PostgreSQL metrics (if pg_exporter is added)
  - job_name: 'postgres'
    scrape_interval: 30s
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'
          component: 'database'

  # Redis metrics (if redis_exporter is added)
  - job_name: 'redis'
    scrape_interval: 30s
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          component: 'cache'

  # OpenTelemetry Collector metrics
  - job_name: 'otel-collector'
    scrape_interval: 15s
    static_configs:
      - targets: ['otel-collector:8888']
        labels:
          service: 'otel-collector'
          component: 'observability'
