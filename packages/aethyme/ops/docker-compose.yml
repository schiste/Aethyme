version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: aethyme-postgres
    environment:
      POSTGRES_DB: aethyme
      POSTGRES_USER: aethyme
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aethyme_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aethyme"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: aethyme-redis
    ports:
      - "6380:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: ops/Dockerfile.api
    container_name: aethyme-api
    environment:
      DATABASE_URL: postgresql://aethyme:${DB_PASSWORD:-aethyme_dev_password}@postgres:5432/aethyme
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development_secret_key_change_in_production}
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
      ALLOWED_HOSTS: '["localhost","127.0.0.1"]'
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../src:/app/src:ro
    command: ["bash", "scripts/start-api.sh"]

  # Optional: Prometheus for metrics
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: aethyme-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:11.3.0
    container_name: aethyme-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: aethyme-network