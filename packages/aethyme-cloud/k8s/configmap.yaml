apiVersion: v1
kind: ConfigMap
metadata:
  name: aethyme-config
  namespace: aethyme-cloud
data:
  # Environment
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"

  # API Settings
  API_HOST: "0.0.0.0"
  API_PORT: "8000"

  # Database Settings
  DB_POOL_MIN_SIZE: "2"
  DB_POOL_MAX_SIZE: "20"
  DB_ECHO: "false"

  # JWT Settings
  JWT_EXPIRATION_MINUTES: "1440"
  REFRESH_TOKEN_EXPIRATION_DAYS: "30"
  JWT_ALGORITHM: "HS256"

  # Rate Limiting
  RATE_LIMIT_PER_MINUTE: "100"
  RATE_LIMIT_PER_HOUR: "1000"
  RATE_LIMIT_PER_DAY: "10000"

  # Sentry
  SENTRY_ENVIRONMENT: "production"
  SENTRY_TRACES_SAMPLE_RATE: "0.1"

  # Service URLs (internal)
  REDIS_URL: "redis://aethyme-redis:6379/0"
  ELASTICSEARCH_URL: "http://aethyme-elasticsearch:9200"
  CELERY_BROKER_URL: "redis://aethyme-redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://aethyme-redis:6379/0"

  # Celery
  CELERY_WORKER_CONCURRENCY: "10"

  # Email
  FROM_EMAIL: "noreply@aethyme.com"
  SUPPORT_EMAIL: "support@aethyme.com"

  # Feature Flags
  FEATURE_GITLAB_INTEGRATION: "true"
  FEATURE_BITBUCKET_INTEGRATION: "true"
  FEATURE_SSO: "false"
  FEATURE_ANALYTICS: "true"
