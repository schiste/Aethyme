[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# Coverage settings
addopts =
    --verbose
    --cov=app
    --cov-report=term-missing
    --cov-report=html:coverage_html
    --cov-branch
    --cov-fail-under=80
    -ra

# Environment
env =
    TESTING=true
    DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5433/aethyme_test
    REDIS_URL=redis://localhost:6380
    ELASTICSEARCH_URL=http://localhost:9201
    JWT_SECRET_KEY=test-secret-key-do-not-use-in-production-12345678901234567890

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
