name: Aethyme Cloud - Isolation Test

# This workflow ensures aethyme-cloud can be extracted to a separate repo
# Tests run in isolation to validate no dependencies on parent Mockup repo

on:
  pull_request:
    paths:
      - 'packages/aethyme-cloud/**'
  push:
    branches:
      - main
    paths:
      - 'packages/aethyme-cloud/**'

jobs:
  isolation-validation:
    name: Validate Extraction Readiness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Copy to isolated directory
        run: |
          echo "📦 Copying aethyme-cloud to isolated test directory..."
          mkdir -p /tmp/aethyme-cloud-isolation-test
          cp -r packages/aethyme-cloud/* /tmp/aethyme-cloud-isolation-test/
          echo "✅ Copy complete"

      - name: Test standalone installation
        working-directory: /tmp/aethyme-cloud-isolation-test
        run: |
          echo "📥 Installing dependencies in isolation..."
          pnpm install
          echo "✅ Dependencies installed"

      - name: Run TypeScript compilation
        working-directory: /tmp/aethyme-cloud-isolation-test
        run: |
          echo "🔍 Running TypeScript compilation..."
          pnpm typecheck
          echo "✅ TypeScript compilation successful"

      - name: Run linting
        working-directory: /tmp/aethyme-cloud-isolation-test
        run: |
          echo "🔍 Running linters..."
          pnpm lint
          echo "✅ Linting passed"

      - name: Run tests
        working-directory: /tmp/aethyme-cloud-isolation-test
        run: |
          echo "🧪 Running tests..."
          pnpm test
          echo "✅ All tests passed"

      - name: Run build
        working-directory: /tmp/aethyme-cloud-isolation-test
        run: |
          echo "🏗️ Building project..."
          pnpm build
          echo "✅ Build successful"

      - name: Check for parent imports
        run: |
          echo "🔍 Checking for imports from parent repository..."
          cd /tmp/aethyme-cloud-isolation-test

          # Fail if any imports reference parent directories outside aethyme-cloud/
          if grep -r "from '\.\./\.\./\.\./\.\." apps/ packages/ 2>/dev/null; then
            echo "❌ ERROR: Found imports from parent repository!"
            echo "Imports should only reference code within aethyme-cloud/"
            exit 1
          fi

          if grep -r 'import.*from.*["'\'']../../../../' apps/ packages/ 2>/dev/null; then
            echo "❌ ERROR: Found imports from parent repository!"
            exit 1
          fi

          echo "✅ No parent imports found"

      - name: Validate environment variables
        run: |
          echo "🔍 Validating .env.example completeness..."
          cd /tmp/aethyme-cloud-isolation-test

          if [ ! -f .env.example ]; then
            echo "❌ ERROR: .env.example not found!"
            exit 1
          fi

          echo "✅ Environment configuration found"

      - name: Validate Docker Compose
        run: |
          echo "🔍 Validating Docker Compose configuration..."
          cd /tmp/aethyme-cloud-isolation-test

          if [ ! -f docker-compose.yml ]; then
            echo "❌ ERROR: docker-compose.yml not found!"
            exit 1
          fi

          # Validate Docker Compose syntax
          docker-compose config > /dev/null

          echo "✅ Docker Compose configuration valid"

      - name: Summary
        if: success()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ ISOLATION TEST PASSED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "✅ Standalone installation successful"
          echo "✅ TypeScript compilation passed"
          echo "✅ Linting passed"
          echo "✅ Tests passed"
          echo "✅ Build successful"
          echo "✅ No parent imports detected"
          echo "✅ Environment configured"
          echo "✅ Docker Compose valid"
          echo ""
          echo "📦 Aethyme Cloud is ready for extraction!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
