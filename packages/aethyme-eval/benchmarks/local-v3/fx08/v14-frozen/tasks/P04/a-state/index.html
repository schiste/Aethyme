<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quantity form</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="panel">
      <h1>Add an item</h1>
      <form id="quantity-form">
        <label for="quantity">Quantity</label>
        <input id="quantity" name="quantity" type="number" min="1" max="5" value="1" required>
        <button id="add-to-cart" type="submit">Add to cart</button>
      </form>
      <p id="cart-count" class="status" aria-live="polite">Cart items: 0</p>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
