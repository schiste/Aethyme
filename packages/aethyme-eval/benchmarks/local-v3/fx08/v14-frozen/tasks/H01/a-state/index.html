<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Category comparison</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="panel">
      <h1>Catalog categories</h1>
      <fieldset id="category-filters">
        <legend>Choose categories</legend>
        <label><input type="checkbox" name="category" value="plants"> Plants</label>
        <label><input type="checkbox" name="category" value="minerals"> Minerals</label>
      </fieldset>
      <button id="apply-categories" type="button">Apply categories</button>
      <ul id="category-results" class="result-list" aria-live="polite"></ul>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
