# ==============================================================================
# Kubernetes Secrets - EXAMPLE
# DO NOT commit actual secrets to version control!
# Use kubectl create secret or external secret management (Vault, AWS Secrets Manager)
# ==============================================================================

# ------------------------------------------------------------------------------
# Database Credentials
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: repograph-cloud
type: Opaque
stringData:
  # Replace with actual database URL
  url: "postgresql+asyncpg://user:password@postgres-host:5432/repograph"

---
# ------------------------------------------------------------------------------
# JWT Secrets
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secrets
  namespace: repograph-cloud
type: Opaque
stringData:
  # Generate with: openssl rand -hex 32
  secret-key: "REPLACE_WITH_ACTUAL_SECRET"
  refresh-secret: "REPLACE_WITH_ACTUAL_REFRESH_SECRET"

---
# ------------------------------------------------------------------------------
# Encryption Key
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: encryption-key
  namespace: repograph-cloud
type: Opaque
stringData:
  # Generate with: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  key: "REPLACE_WITH_FERNET_KEY"

---
# ------------------------------------------------------------------------------
# OAuth Credentials (GitHub)
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: github-oauth
  namespace: repograph-cloud
type: Opaque
stringData:
  client-id: "REPLACE_WITH_GITHUB_CLIENT_ID"
  client-secret: "REPLACE_WITH_GITHUB_CLIENT_SECRET"
  webhook-secret: "REPLACE_WITH_GITHUB_WEBHOOK_SECRET"

---
# ------------------------------------------------------------------------------
# Sentry DSN
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: sentry-dsn
  namespace: repograph-cloud
type: Opaque
stringData:
  dsn: "REPLACE_WITH_SENTRY_DSN"

---
# ------------------------------------------------------------------------------
# Stripe Credentials
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: stripe-credentials
  namespace: repograph-cloud
type: Opaque
stringData:
  secret-key: "REPLACE_WITH_STRIPE_SECRET_KEY"
  publishable-key: "REPLACE_WITH_STRIPE_PUBLISHABLE_KEY"
  webhook-secret: "REPLACE_WITH_STRIPE_WEBHOOK_SECRET"

---
# ------------------------------------------------------------------------------
# SendGrid API Key
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: sendgrid-api-key
  namespace: repograph-cloud
type: Opaque
stringData:
  api-key: "REPLACE_WITH_SENDGRID_API_KEY"

---
# ==============================================================================
# INSTRUCTIONS FOR CREATING ACTUAL SECRETS
# ==============================================================================
#
# DO NOT USE THIS FILE DIRECTLY IN PRODUCTION!
#
# Method 1: Create secrets manually with kubectl
# ----------------------------------------------
# kubectl create secret generic db-credentials \
#   --from-literal=url='postgresql+asyncpg://user:pass@host:5432/repograph' \
#   -n repograph-cloud
#
# kubectl create secret generic jwt-secrets \
#   --from-literal=secret-key=$(openssl rand -hex 32) \
#   --from-literal=refresh-secret=$(openssl rand -hex 32) \
#   -n repograph-cloud
#
# kubectl create secret generic encryption-key \
#   --from-literal=key=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())") \
#   -n repograph-cloud
#
# Method 2: Use external secret management
# -----------------------------------------
# - HashiCorp Vault with External Secrets Operator
# - AWS Secrets Manager with External Secrets Operator
# - Google Secret Manager with Workload Identity
# - Azure Key Vault with Pod Identity
#
# ==============================================================================
