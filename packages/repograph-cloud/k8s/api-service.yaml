apiVersion: v1
kind: Service
metadata:
  name: repograph-api
  namespace: repograph-cloud
  labels:
    app: repograph-api
    component: backend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: repograph-api
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  sessionAffinity: None
