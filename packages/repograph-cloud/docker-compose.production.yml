# ==============================================================================
# RepoGraph Cloud - Production Docker Compose
# Use this for production deployment or production-like testing
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database
  # TODO: Consider using Docker secrets for POSTGRES_PASSWORD instead of env vars
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: repograph-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: repograph
      POSTGRES_USER: ${POSTGRES_USER:-repograph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups/postgres:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repograph"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - repograph-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # Redis (Cache + Rate Limiting + Celery Broker)
  # TODO: Consider using Docker secrets for Redis password
  # ----------------------------------------------------------------------------
  redis:
    image: redis:8-alpine
    container_name: repograph-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - repograph-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # Elasticsearch (Code Search)
  # ----------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: repograph-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - repograph-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # API Application
  # TODO: Consider using Docker secrets for JWT_SECRET_KEY, REFRESH_TOKEN_SECRET_KEY,
  #       ENCRYPTION_KEY, GITHUB_CLIENT_SECRET, STRIPE_SECRET_KEY, SENDGRID_API_KEY
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.production
    container_name: repograph-api
    restart: unless-stopped
    environment:
      # Environment
      ENVIRONMENT: production
      LOG_LEVEL: INFO

      # Database
      DATABASE_URL: postgresql+asyncpg://repograph:${POSTGRES_PASSWORD}@postgres:5432/repograph
      DB_POOL_MIN_SIZE: 2
      DB_POOL_MAX_SIZE: 20

      # Redis
      REDIS_URL: redis://redis:6379/0

      # Elasticsearch
      ELASTICSEARCH_URL: http://elasticsearch:9200

      # JWT
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      REFRESH_TOKEN_SECRET_KEY: ${REFRESH_TOKEN_SECRET_KEY}
      JWT_EXPIRATION_MINUTES: 1440
      REFRESH_TOKEN_EXPIRATION_DAYS: 30

      # Encryption
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # API
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-https://app.repograph.io}

      # Rate Limiting
      RATE_LIMIT_PER_MINUTE: 100
      RATE_LIMIT_PER_HOUR: 1000
      RATE_LIMIT_PER_DAY: 10000

      # Celery
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

      # Sentry
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
      SENTRY_TRACES_SAMPLE_RATE: 0.1

      # OAuth (optional)
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}

      # Stripe (optional)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}

      # SendGrid (optional)
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}

    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - repograph-network
    volumes:
      - ./logs:/app/logs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # Celery Worker (Background Tasks)
  # TODO: Consider using Docker secrets for sensitive environment variables
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.production
    container_name: repograph-worker
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4
    environment:
      # Same environment as API
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://repograph:${POSTGRES_PASSWORD}@postgres:5432/repograph
      REDIS_URL: redis://redis:6379/0
      ELASTICSEARCH_URL: http://elasticsearch:9200
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - repograph-network
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # Celery Beat (Scheduled Tasks)
  # TODO: Consider using Docker secrets for sensitive environment variables
  # ----------------------------------------------------------------------------
  beat:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.production
    container_name: repograph-beat
    restart: unless-stopped
    command: celery -A app.core.celery_app beat --loglevel=info
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://repograph:${POSTGRES_PASSWORD}@postgres:5432/repograph
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      - redis
    networks:
      - repograph-network
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # OpenTelemetry Collector (Distributed Tracing)
  # ----------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector:0.91.0
    container_name: repograph-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/config/observability/otel-collector.yaml"]
    volumes:
      - ./config/observability/otel-collector.yaml:/etc/config/observability/otel-collector.yaml
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8889:8889"   # Prometheus metrics exporter
    networks:
      - repograph-network
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # Jaeger (Tracing Backend)
  # ----------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: repograph-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"  # Jaeger UI
      - "14250:14250"  # gRPC
    networks:
      - repograph-network
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  elasticsearch_data:
    driver: local

# ==============================================================================
# Networks
# ==============================================================================
networks:
  repograph-network:
    driver: bridge
